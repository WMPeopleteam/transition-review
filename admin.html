<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 · 채용연계형 인턴 평가</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root {
  --navy: #16233f;
  --navy-2: #223761;
  --accent: #2f6feb;
  --accent-soft: #e8f0ff;
  --ink: #1c222c;
  --muted: #6b7484;
  --line: #e3e6ec;
  --bg: #f5f6f8;
  --card: #ffffff;
  --good: #1e8a5f;
  --warn: #b8860b;
  --bad: #c0392b;
  --radius: 10px;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  font-size: 15px;
}

a { color: inherit; }

.topbar {
  background: var(--navy);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar .brand {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.2px;
}
.topbar .brand small {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: #aab7cf;
  margin-top: 2px;
}
.topbar .who { font-size: 13px; color: #cfd8ea; }
.topbar .who button {
  margin-left: 12px;
  background: transparent;
  color: #fff;
  border: 1px solid #445580;
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 12px;
}
.topbar .who button:hover { background: #223761; }

.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}

.center-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(22, 35, 63, 0.10);
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.login-card .mark {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; margin: 0 auto 18px;
}
.login-card h1 { font-size: 18px; margin: 0 0 4px; }
.login-card p.sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

input[type="text"], input[type="password"], textarea, select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  color: var(--ink);
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--accent);
}
textarea { resize: vertical; min-height: 70px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  width: 100%;
}
.btn:hover { background: #2557c4; }
.btn:disabled { background: #b7c4de; cursor: not-allowed; }
.btn.secondary {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
  width: auto;
}
.btn.secondary:hover { background: #f0f2f5; }
.btn.small { padding: 6px 12px; font-size: 12.5px; width: auto; }

.error-msg {
  color: var(--bad);
  font-size: 13px;
  margin-top: 10px;
  min-height: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 4px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.section-title .pts { font-weight: 400; font-size: 12.5px; color: var(--muted); }

.hello { font-size: 15px; margin-bottom: 2px; }
.hello strong { color: var(--navy); }
.page-desc { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

.assign-list { display: flex; flex-direction: column; gap: 10px; }
.assign-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px;
}
.assign-item .info { display: flex; flex-direction: column; gap: 2px; }
.assign-item .intern-name { font-weight: 700; font-size: 15px; }
.assign-item .meta { font-size: 12.5px; color: var(--muted); }
.badge {
  font-size: 11.5px; font-weight: 600; border-radius: 20px; padding: 3px 10px;
  background: var(--accent-soft); color: var(--accent);
}
.badge.role { background: #eef0f4; color: var(--muted); margin-right: 6px; }
.badge.done { background: #e5f6ee; color: var(--good); }
.badge.pending { background: #fdf1e0; color: var(--warn); }

.level-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 6px; }
.level-option {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  cursor: pointer; transition: border-color .12s, background .12s;
}
.level-option:hover { border-color: #b9c5dd; }
.level-option.selected { border-color: var(--accent); background: var(--accent-soft); }
.level-option input { margin-top: 3px; }
.level-option .lv-head { font-weight: 700; font-size: 13.5px; }
.level-option .lv-text { font-size: 13px; color: #40495a; margin-top: 2px; }
.level-option .lv-pts { font-size: 12px; color: var(--muted); margin-left: 6px; font-weight: 400; }

.note-field { margin-top: 10px; }
.note-field label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }

.risk-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.risk-table th, .risk-table td { border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: left; vertical-align: top; }
.risk-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.risk-radio-group { display: flex; gap: 12px; }
.risk-radio-group label { display: flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
.risk-detail { width: 100%; }

.field-row { margin-bottom: 16px; }
.field-row label.field-label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }

.reco-group { display: flex; gap: 8px; flex-wrap: wrap; }
.reco-group label {
  border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer;
}
.reco-group input { display: none; }
.reco-group label.selected { background: var(--navy); color: #fff; border-color: var(--navy); }

.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

table.admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #fff; }
table.admin-table th, table.admin-table td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; }
table.admin-table th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
table.admin-table tr:hover td { background: #fafbfc; }
.progress-pill { font-weight: 700; }
.progress-pill.full { color: var(--good); }
.progress-pill.partial { color: var(--warn); }
.progress-pill.zero { color: var(--muted); }

.role-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 8px; border-radius: 20px; margin-right: 4px; margin-bottom: 4px; background: #eef0f4; color: var(--muted); }
.role-chip.on { background: #e5f6ee; color: var(--good); }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
.toolbar .actions { display: flex; gap: 8px; }

.stat-row { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-box { flex: 1; min-width: 140px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.stat-box .num { font-size: 26px; font-weight: 800; color: var(--navy); }
.stat-box .lbl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* Report / print */
.report-page {
  background: #fff;
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 44px;
  border: 1px solid var(--line);
}
.report-page h1 { font-size: 20px; margin: 0 0 2px; }
.report-page .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
.report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 24px; margin-bottom: 18px; font-size: 13px; }
.report-grid div span.k { color: var(--muted); margin-right: 6px; }
.report-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 16px; }
.report-table th, .report-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
.report-table th { background: #f5f6f8; }
.report-table td.text-cell { text-align: left; font-size: 12px; }
.report-final { font-size: 14px; font-weight: 700; margin-top: 6px; }

@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
  .report-page { border: none; padding: 0; }
}

.empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }

.loading-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 4px; }

</style>
</head>
<body>

<div id="topbar" class="topbar" style="display:none;">

</div>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>


    // ==== rubric.js ====

const SCALE_DESC = [

  '공사책임자': '공사책임자',
  '멘토': '멘토',
  '동료': '동료'
};


    // ==== config.js (Apps Script 배포 URL은 여기서 수정) ====
// Google Apps Script 웹앱 배포 후 발급되는 URL을 아래에 붙여넣으세요.
// 예: https://script.google.com/macros/s/AKfycbx.../exec
// 설정 방법은 README.md의 "3. Apps Script 배포" 참고
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxVe9ulY_-ymlUjnsgvgGg3dwZZIDI9QH26Mb2bAvNasQol_ZSZUOCBLVDO238338_Y/exec'
};


    // ==== admin.js ====
(function () {
  const appEl = document.getElementById('app');
  const topbar = document.getElementById('topbar');
  const whoBox = document.getElementById('whoBox');

  let state = {
    code: sessionStorage.getItem('tr_admin_code') || '',
    view: sessionStorage.getItem('tr_admin_code') ? 'dashboard' : 'login',
    interns: []
  };

  function apiGet(action, params) {
    const url = new URL(CONFIG.API_URL);
    url.searchParams.set('action', action);
    Object.keys(params || {}).forEach(k => url.searchParams.set(k, params[k]));
    return fetch(url.toString()).then(r => r.json());
  }

  function configured() {
    return CONFIG.API_URL && CONFIG.API_URL.indexOf('PASTE_YOUR') === -1;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function updateTopbar() {
    if (state.view === 'login') { topbar.style.display = 'none'; return; }
    topbar.style.display = 'flex';
    whoBox.innerHTML = `<button id="logoutBtn">로그아웃</button>
      <a href="index.html" style="margin-left:10px;color:#cfd8ea;font-size:12px;">← 평가자 화면</a>`;
    document.getElementById('logoutBtn').onclick = logout;
  }

  function logout() {
    sessionStorage.removeItem('tr_admin_code');
    state = { code: '', view: 'login', interns: [] };
    render();
  }

  function renderLogin() {
    appEl.innerHTML = `
    <div class="center-wrap">
      <div class="login-card">
        <div class="mark">관리</div>
        <h1>관리자 접속</h1>
        <p class="sub">인사담당자에게 전달받은 접속 코드를 입력하세요.</p>
        ${!configured() ? `<p class="error-msg" style="margin-bottom:14px;">⚠ 서버(Apps Script) 연결이 설정되지 않았습니다. config.js를 확인해주세요.</p>` : ''}
        <div class="field-row" style="text-align:left;">
          <input type="password" id="codeInput" placeholder="접속 코드" />
        </div>
        <button class="btn" id="loginBtn">입장</button>
        <div class="error-msg" id="loginError"></div>
      </div>
    </div>`;
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  }

  function doLogin() {
    const code = document.getElementById('codeInput').value.trim();
    const errEl = document.getElementById('loginError');
    if (!code) { errEl.textContent = '접속 코드를 입력해주세요.'; return; }
    apiGet('adminLogin', { code }).then(res => {
      if (!res.ok) { errEl.textContent = res.error || '접속 코드가 올바르지 않습니다.'; return; }
      state.code = code;
      sessionStorage.setItem('tr_admin_code', code);
      state.view = 'dashboard';
      loadDashboard();
    }).catch(() => { errEl.textContent = '서버에 연결할 수 없습니다.'; });
  }

  function loadDashboard() {
    appEl.innerHTML = `<div class="wrap"><div class="empty-state">불러오는 중...</div></div>`;
    updateTopbar();
    apiGet('adminData', { code: state.code }).then(res => {
      if (!res.ok) { logout(); return; }
      state.interns = res.interns;
      renderDashboard();
    });
  }

  function renderDashboard() {
    const total = state.interns.length;
    const fullyDone = state.interns.filter(i => i.doneCount === i.total).length;
    const totalSlots = state.interns.reduce((s, i) => s + i.total, 0);
    const doneSlots = state.interns.reduce((s, i) => s + i.doneCount, 0);

    appEl.innerHTML = `
    <div class="wrap">
      <div class="toolbar">
        <div class="hello">평가 진행 현황</div>
        <div class="actions">
          <button class="btn secondary small" id="refreshBtn">새로고침</button>
          <button class="btn secondary small" id="exportBtn">엑셀 다운로드</button>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-box"><div class="num">${total}</div><div class="lbl">전체 인턴</div></div>
        <div class="stat-box"><div class="num">${fullyDone}</div><div class="lbl">4명 평가 모두 완료</div></div>
        <div class="stat-box"><div class="num">${doneSlots} / ${totalSlots}</div><div class="lbl">전체 제출 건수</div></div>
      </div>
      <table class="admin-table">
        <thead><tr><th>인턴</th><th>배치현장</th><th>진행률</th><th>평가자별 제출 현황</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>`;

    document.getElementById('refreshBtn').onclick = loadDashboard;
    document.getElementById('exportBtn').onclick = exportExcel;

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = state.interns.map(intern => {
      const pct = intern.doneCount === intern.total ? 'full' : (intern.doneCount === 0 ? 'zero' : 'partial');
      return `
      <tr>
        <td><strong>${escapeHtml(intern.intern)}</strong></td>
        <td>${escapeHtml(intern.site || '')}</td>
        <td><span class="progress-pill ${pct}">${intern.doneCount} / ${intern.total}</span></td>
        <td>${intern.roles.map(r => `<span class="role-chip ${r.submitted ? 'on' : ''}">${escapeHtml(r.role)}${r.submitted ? ' ✓' : ''}</span>`).join('')}</td>
        <td><button class="btn secondary small" data-intern="${escapeHtml(intern.intern)}">리포트 보기</button></td>
      </tr>`;
    }).join('');

    tbody.querySelectorAll('button[data-intern]').forEach(btn => {
      btn.onclick = () => {
        window.location.href = `report.html?intern=${encodeURIComponent(btn.dataset.intern)}`;
      };
    });
  }

  function exportExcel() {
    apiGet('adminAllRecords', { code: state.code }).then(res => {
      if (!res.ok) { alert(res.error || '내보내기에 실패했습니다.'); return; }
      const records = res.records;
      if (!records.length) { alert('아직 제출된 평가가 없습니다.'); return; }
      const rows = records.map(r => {
        const row = Object.assign({}, r);
        if (typeof row['위험요인_JSON'] === 'string') {
          try {
            const risk = JSON.parse(row['위험요인_JSON']);
            const flagged = Object.keys(risk).filter(i => risk[i].level && risk[i].level !== '해당없음');
            row['위험요인_요약'] = flagged.map(i => `${RISK_ITEMS[i]}(${risk[i].level})`).join('; ');
          } catch (e) { row['위험요인_요약'] = ''; }
        }
        return row;
      });
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '평가결과');
      const ts = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `인턴평가결과_${ts}.xlsx`);
    });
  }

  function render() {
    updateTopbar();
    if (state.view === 'login') renderLogin();
    else loadDashboard();
  }

  render();
})();

</script>
</body>
</html>
