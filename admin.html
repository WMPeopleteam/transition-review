<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 · 채용연계형 인턴 리뷰</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root {
  --navy: #16233f;
  --navy-2: #223761;
  --accent: #2f6feb;
  --accent-soft: #e8f0ff;
  --ink: #1c222c;
  --muted: #6b7484;
  --line: #e3e6ec;
  --bg: #f5f6f8;
  --card: #ffffff;
  --good: #1e8a5f;
  --warn: #b8860b;
  --bad: #c0392b;
  --radius: 10px;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  font-size: 15px;
}

a { color: inherit; }

.topbar {
  background: var(--navy);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar .brand {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.2px;
}
.topbar .brand small {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: #aab7cf;
  margin-top: 2px;
}
.topbar .who { font-size: 13px; color: #cfd8ea; }
.topbar .who button {
  margin-left: 12px;
  background: transparent;
  color: #fff;
  border: 1px solid #445580;
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 12px;
}
.topbar .who button:hover { background: #223761; }

.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}

.center-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(22, 35, 63, 0.10);
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.login-card .mark {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; margin: 0 auto 18px;
}
.login-card h1 { font-size: 18px; margin: 0 0 4px; }
.login-card p.sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

input[type="text"], input[type="password"], textarea, select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  color: var(--ink);
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--accent);
}
textarea { resize: vertical; min-height: 70px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  width: 100%;
}
.btn:hover { background: #2557c4; }
.btn:disabled { background: #b7c4de; cursor: not-allowed; }
.btn.secondary {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
  width: auto;
}
.btn.secondary:hover { background: #f0f2f5; }
.btn.small { padding: 6px 12px; font-size: 12.5px; width: auto; }

.error-msg {
  color: var(--bad);
  font-size: 13px;
  margin-top: 10px;
  min-height: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 4px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.section-title .pts { font-weight: 400; font-size: 12.5px; color: var(--muted); }

.hello { font-size: 15px; margin-bottom: 2px; }
.hello strong { color: var(--navy); }
.page-desc { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

.assign-list { display: flex; flex-direction: column; gap: 10px; }
.assign-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px;
}
.assign-item .info { display: flex; flex-direction: column; gap: 2px; }
.assign-item .intern-name { font-weight: 700; font-size: 15px; }
.assign-item .meta { font-size: 12.5px; color: var(--muted); }
.badge {
  font-size: 11.5px; font-weight: 600; border-radius: 20px; padding: 3px 10px;
  background: var(--accent-soft); color: var(--accent);
}
.badge.role { background: #eef0f4; color: var(--muted); margin-right: 6px; }
.badge.done { background: #e5f6ee; color: var(--good); }
.badge.pending { background: #fdf1e0; color: var(--warn); }

.level-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 6px; }
.level-option {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  cursor: pointer; transition: border-color .12s, background .12s;
}
.level-option:hover { border-color: #b9c5dd; }
.level-option.selected { border-color: var(--accent); background: var(--accent-soft); }
.level-option input { margin-top: 3px; }
.level-option .lv-head { font-weight: 700; font-size: 13.5px; }
.level-option .lv-text { font-size: 13px; color: #40495a; margin-top: 2px; }
.level-option .lv-pts { font-size: 12px; color: var(--muted); margin-left: 6px; font-weight: 400; }

.note-field { margin-top: 10px; }
.note-field label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }

.risk-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.risk-table th, .risk-table td { border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: left; vertical-align: top; }
.risk-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.risk-radio-group { display: flex; gap: 12px; }
.risk-radio-group label { display: flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
.risk-detail { width: 100%; }

.field-row { margin-bottom: 16px; }
.field-row label.field-label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }

.reco-group { display: flex; gap: 8px; flex-wrap: wrap; }
.reco-group label {
  border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer;
}
.reco-group input { display: none; }
.reco-group label.selected { background: var(--navy); color: #fff; border-color: var(--navy); }

.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

table.admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #fff; }
table.admin-table th, table.admin-table td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; }
table.admin-table th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
table.admin-table tr:hover td { background: #fafbfc; }
.progress-pill { font-weight: 700; }
.progress-pill.full { color: var(--good); }
.progress-pill.partial { color: var(--warn); }
.progress-pill.zero { color: var(--muted); }

.role-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 8px; border-radius: 20px; margin-right: 4px; margin-bottom: 4px; background: #eef0f4; color: var(--muted); }
.role-chip.on { background: #e5f6ee; color: var(--good); }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
.toolbar .actions { display: flex; gap: 8px; }

.stat-row { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-box { flex: 1; min-width: 140px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.stat-box .num { font-size: 26px; font-weight: 800; color: var(--navy); }
.stat-box .lbl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* Report / print */
.report-page {
  background: #fff;
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 44px;
  border: 1px solid var(--line);
}
.report-page h1 { font-size: 20px; margin: 0 0 2px; }
.report-page .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
.report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 24px; margin-bottom: 18px; font-size: 13px; }
.report-grid div span.k { color: var(--muted); margin-right: 6px; }
.report-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 16px; }
.report-table th, .report-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
.report-table th { background: #f5f6f8; }
.report-table td.text-cell { text-align: left; font-size: 12px; }
.report-final { font-size: 14px; font-weight: 700; margin-top: 6px; }

@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
  .report-page { border: none; padding: 0; }
}

.empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }

.loading-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 4px; }

</style>
</head>

];

const RISK_LEVELS = ['해당없음', '주의', '중대'];

const RECOMMENDATION_OPTIONS = ['전환 권고', '조건부 전환', '전환 신중', '미전환 권고'];

const TRANSITION_MATRIX = [
  { label: '전환 권고', desc: '역량리뷰 80점 이상 + 중대 위험요인 없음' },
  { label: '조건부 전환', desc: '역량리뷰 70점 이상 80점 미만 또는 주의 위험요인 1건' },
  { label: '전환 신중', desc: '역량리뷰 60점 이상 70점 미만 또는 주의 위험요인 2건 이상' },
  { label: '미전환 권고', desc: '역량리뷰 60점 미만 또는 중대 위험요인 있음' }
];

// 5개 영역 환산점수 합계 + 위험요인 단계로 추천의견을 자동 계산
function computeAutoRecommendation(scores, risk) {
  let total = 0;
  let scoredCount = 0;
  RUBRIC_AREAS.forEach(area => {
    const raw = scores[area.key];
    const lv = area.levels.find(l => l.score === raw);
    if (lv) { total += lv.converted; scoredCount++; }
  });
  if (scoredCount < RUBRIC_AREAS.length) return null; // 아직 5개 영역 모두 선택 전

  let cautionCount = 0, seriousCount = 0;
  Object.keys(risk || {}).forEach(k => {
    const lv = risk[k] && risk[k].level;
    if (lv === '주의') cautionCount++;
    if (lv === '중대') seriousCount++;
  });

  const scoreTier = total >= 80 ? 4 : total >= 70 ? 3 : total >= 60 ? 2 : 1;
  const riskTier = seriousCount > 0 ? 1 : cautionCount >= 2 ? 2 : cautionCount === 1 ? 3 : 4;
  const tier = Math.min(scoreTier, riskTier);
  return RECOMMENDATION_OPTIONS[4 - tier]; // tier4→전환권고(idx0) ... tier1→미전환권고(idx3)
}

// 평가결과 시트의 컬럼명과 RUBRIC_AREAS.key를 매핑 (app.js / report.js 공용)
const AREA_FIELD_MAP = [
  ['area1', '①기본근무태도_점수', '①근거'],
  ['area2', '②학습태도피드백_점수', '②근거'],
  ['area3', '③현장적응협업_점수', '③근거'],
  ['area4', '④업무수행기초역량_점수', '④근거'],
  ['area5', '⑤성장가능성직무적합성_점수', '⑤근거']
];

const ROLE_LABELS = {
  '현장소장': '현장소장',
  '공사책임자': '공사책임자',
  '멘토': '멘토',
  '동료': '멘토B'
};
function roleLabel(role) { return ROLE_LABELS[role] || role; }

// 5개 영역 환산점수 합계 계산 (선택된 영역만 집계, 몇 개 선택됐는지도 함께 반환)
function computeTotalScore(scores) {
  let total = 0, scoredCount = 0;
  RUBRIC_AREAS.forEach(area => {
    const raw = scores[area.key];
    const lv = area.levels.find(l => l.score === raw);
    if (lv) { total += lv.converted; scoredCount++; }
  });
  return { total, scoredCount, maxCount: RUBRIC_AREAS.length };
}

        }).catch(() => { idx++; next(); });
      }).catch(() => { idx++; next(); });
    }
    next();
  }

  function exportExcel() {
    apiGet('adminAllRecords', { code: state.code }).then(res => {
      if (!res.ok) { alert(res.error || '내보내기에 실패했습니다.'); return; }
      const records = res.records;
      if (!records.length) { alert('아직 제출된 리뷰가 없습니다.'); return; }
      const rows = records.map(r => {
        let risk = {};
        try { risk = JSON.parse(r['위험요인_JSON'] || '{}'); } catch (e) {}
        const flagged = Object.keys(risk).filter(i => risk[i] && risk[i].level && risk[i].level !== '해당없음');
        const riskSummary = flagged.map(i => `${RISK_ITEMS[i]}(${risk[i].level})`).join('; ');

        const row = {
          '제출시각': r['제출시각'],
          '사번': r['사번'],
          '리뷰자명': r['평가자명'],
          '역할': roleLabel(r['역할']),
          '피리뷰자': r['피평가자']
        };
        let total = 0;
        AREA_FIELD_MAP.forEach(([key, scoreField, noteField], idx) => {
          const area = RUBRIC_AREAS[idx];
          const raw = Number(r[scoreField]);
          const lv = area.levels.find(l => l.score === raw);
          const conv = lv ? lv.converted : '';
          if (lv) total += lv.converted;
          row[`${area.no}${area.title}_환산점수`] = conv;
          row[`${area.no}${area.title}_근거`] = r[noteField] || '';
        });
        row['합계(100점만점)'] = total;
        row['위험요인_요약'] = riskSummary;
        row['종합의견'] = r['종합의견'] || '';
        row['리뷰자추천의견'] = r['평가자추천의견'] || '';
        return row;
      });
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '리뷰결과(환산)');
      const ts = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `인턴리뷰결과_${ts}.xlsx`);
    });
  }

  function renderOtpTool() {
    return `
    <div class="card" style="margin-top:24px;">
      <div class="section-title">테스트용 인증번호 발급</div>
      <div class="page-desc" style="margin-bottom:10px;">리뷰자 사번을 넣고 발급하면, <strong>해당 리뷰자에게는 메일이 가지 않고</strong> 여기 화면에만 인증번호가 표시됩니다. 발급 후 리뷰자 사이트(index.html) 로그인 화면 하단의 <strong>"관리자에게 받은 인증번호가 있으신가요?"</strong> 링크를 눌러 사번+인증번호를 바로 입력하면 로그인됩니다. (10분간 유효)</div>
      <div style="display:flex;gap:8px;max-width:360px;">
        <input type="text" id="otpTestSabun" placeholder="사번 입력" style="flex:1;" inputmode="numeric" />
        <button class="btn secondary small" id="otpTestBtn">발급</button>
      </div>
      <div id="otpTestResult" style="margin-top:10px;font-size:13px;"></div>
    </div>`;
  }

  function bindOtpTool() {
    const btn = document.getElementById('otpTestBtn');
    if (!btn) return;
    btn.onclick = () => {
      const sabun = document.getElementById('otpTestSabun').value.trim();
      const resultEl = document.getElementById('otpTestResult');
      resultEl.textContent = '';
      if (!sabun) { resultEl.innerHTML = '<span style="color:var(--bad);">사번을 입력해주세요.</span>'; return; }
      apiGet('adminIssueOtp', { code: state.code, sabun }).then(res => {
        if (!res.ok) { resultEl.innerHTML = `<span style="color:var(--bad);">${escapeHtml(res.error || '발급 실패')}</span>`; return; }
        resultEl.innerHTML = `<strong>${escapeHtml(res.name)}</strong>님 인증번호: <span style="font-size:18px;font-weight:800;color:var(--navy);letter-spacing:2px;">${escapeHtml(res.otp)}</span> <span style="color:var(--muted);">(10분간 유효, 메일 발송 없음)</span>`;
      });
    };
  }

  function render() {
    updateTopbar();
    if (state.view === 'login') renderLogin();
    else loadDashboard();
  }

  render();
})();

</script>
</body>
</html>
