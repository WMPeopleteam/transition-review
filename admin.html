<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 · 인턴·신입사원 리뷰</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root {
  --navy: #16233f;
  --navy-2: #223761;
  --accent: #2f6feb;
  --accent-soft: #e8f0ff;
  --ink: #1c222c;
  --muted: #6b7484;
  --line: #e3e6ec;
  --bg: #f5f6f8;
  --card: #ffffff;
  --good: #1e8a5f;
  --warn: #b8860b;
  --bad: #c0392b;
  --radius: 10px;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  font-size: 15px;
}

a { color: inherit; }

.topbar {
  background: var(--navy);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar .brand {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.2px;
}
.topbar .brand small {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: #aab7cf;
  margin-top: 2px;
}
.topbar .who { font-size: 13px; color: #cfd8ea; }
.topbar .who button {
  margin-left: 12px;
  background: transparent;
  color: #fff;
  border: 1px solid #445580;
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 12px;
}
.topbar .who button:hover { background: #223761; }

.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}

.center-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(22, 35, 63, 0.10);
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.login-card .mark {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; margin: 0 auto 18px;
}
.login-card h1 { font-size: 18px; margin: 0 0 4px; }
.login-card p.sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

input[type="text"], input[type="password"], textarea, select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  color: var(--ink);
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--accent);
}
textarea { resize: vertical; min-height: 70px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  width: 100%;
}
.btn:hover { background: #2557c4; }
.btn:disabled { background: #b7c4de; cursor: not-allowed; }
.btn.secondary {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
  width: auto;
}
.btn.secondary:hover { background: #f0f2f5; }
.btn.small { padding: 6px 12px; font-size: 12.5px; width: auto; }

.error-msg {
  color: var(--bad);
  font-size: 13px;
  margin-top: 10px;
  min-height: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 4px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.section-title .pts { font-weight: 400; font-size: 12.5px; color: var(--muted); }

.hello { font-size: 15px; margin-bottom: 2px; }
.hello strong { color: var(--navy); }
.page-desc { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

.assign-list { display: flex; flex-direction: column; gap: 10px; }
.assign-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px;
}
.assign-item .info { display: flex; flex-direction: column; gap: 2px; }
.assign-item .intern-name { font-weight: 700; font-size: 15px; }
.assign-item .meta { font-size: 12.5px; color: var(--muted); }
.badge {
  font-size: 11.5px; font-weight: 600; border-radius: 20px; padding: 3px 10px;
  background: var(--accent-soft); color: var(--accent);
}
.badge.role { background: #eef0f4; color: var(--muted); margin-right: 6px; }
.badge.done { background: #e5f6ee; color: var(--good); }
.badge.pending { background: #fdf1e0; color: var(--warn); }

.level-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 6px; }
.level-option {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  cursor: pointer; transition: border-color .12s, background .12s;
}
.level-option:hover { border-color: #b9c5dd; }
.level-option.selected { border-color: var(--accent); background: var(--accent-soft); }
.level-option input { margin-top: 3px; }
.level-option .lv-head { font-weight: 700; font-size: 13.5px; }
.level-option .lv-text { font-size: 13px; color: #40495a; margin-top: 2px; }
.level-option .lv-pts { font-size: 12px; color: var(--muted); margin-left: 6px; font-weight: 400; }

.note-field { margin-top: 10px; }
.note-field label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }

.risk-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.risk-table th, .risk-table td { border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: left; vertical-align: top; }
.risk-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.risk-radio-group { display: flex; gap: 12px; }
.risk-radio-group label { display: flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
.risk-detail { width: 100%; }

.field-row { margin-bottom: 16px; }
.field-row label.field-label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }

.reco-group { display: flex; gap: 8px; flex-wrap: wrap; }
.reco-group label {
  border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer;
}
.reco-group input { display: none; }
.reco-group label.selected { background: var(--navy); color: #fff; border-color: var(--navy); }

.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

table.admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #fff; }
table.admin-table th, table.admin-table td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; }
table.admin-table th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
table.admin-table tr:hover td { background: #fafbfc; }
.progress-pill { font-weight: 700; }
.progress-pill.full { color: var(--good); }
.progress-pill.partial { color: var(--warn); }
.progress-pill.zero { color: var(--muted); }

.role-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 8px; border-radius: 20px; margin-right: 4px; margin-bottom: 4px; background: #eef0f4; color: var(--muted); }
.role-chip.on { background: #e5f6ee; color: var(--good); }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
.toolbar .actions { display: flex; gap: 8px; }

.stat-row { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-box { flex: 1; min-width: 140px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.stat-box .num { font-size: 26px; font-weight: 800; color: var(--navy); }
.stat-box .lbl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* Report / print */
.report-page {
  background: #fff;
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 44px;
  border: 1px solid var(--line);
}
.report-page h1 { font-size: 20px; margin: 0 0 2px; }
.report-page .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
.report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 24px; margin-bottom: 18px; font-size: 13px; }
.report-grid div span.k { color: var(--muted); margin-right: 6px; }
.report-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 16px; }
.report-table th, .report-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
.report-table th { background: #f5f6f8; }
.report-table td.text-cell { text-align: left; font-size: 12px; }
.report-final { font-size: 14px; font-weight: 700; margin-top: 6px; }

@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
  .report-page { border: none; padding: 0; }
}

.empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }

.loading-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 4px; }

</style>
</head>

  reportScoreTitle: '수습·OJT 평가 (100점 만점, 확정 점수)',

  finalRoles: ['현장소장', '팀장'] // 최종 확정 점수의 기준이 되는 역할
};

// 본사 인원용 문구 치환 (현장 → 본사, 현장소장 → 팀장 등). 위에서부터 순서대로 적용
const HQ_REPLACEMENTS = [
  [/현장소장/g, '팀장'],
  [/배치현장/g, '소속'],
  [/공정·품질·도면 등/g, '업무 프로세스·규정·시스템 등'],
  [/공정\/품질\/도면/g, '업무 프로세스/규정/시스템'],
  [/직무\(공종\)/g, '직무'],
  [/건축현장/g, '본사'],
  [/현장/g, '본사']
];

// 기존 인턴 리뷰 문항 세트 (위 상수 그대로 사용)
const INTERN_RUBRIC = {
  id: '인턴전환',
  formTitle: '역량리뷰',
  intro: '',
  guide: [],
  scale: SCALE_DESC,
  scaleNote: '',
  adjustable: false,
  areas: RUBRIC_AREAS,
  riskTitle: '위험요인 체크리스트',
  riskShort: '위험요인',
  riskGuide: "'주의' 또는 '중대'로 체크한 항목은 구체적 사실(발생시점·상황·지도내용·개선여부)을 반드시 작성합니다. 위험요인은 점수로 상쇄하지 않습니다.",
  riskItems: RISK_ITEMS,
  riskCriteria: RISK_CRITERIA,
  riskLevels: RISK_LEVELS,
  riskMild: '주의', riskSevere: '중대',
  recoTitle: '리뷰자 추천의견',
  recoGuide: '5개 영역 점수와 위험요인을 바탕으로 아래 매트릭스에 따라 자동 계산됩니다. 필요하면 직접 다른 항목을 선택해 조정할 수 있습니다.',
  recoOptions: RECOMMENDATION_OPTIONS,
  matrixTitle: '전환기준',
  matrix: TRANSITION_MATRIX,
  matrixNote: '허위보고, 무단결근, 부적절한 언행, 피드백 후 동일 문제 반복 등은 총점과 관계없이 미전환을 검토할 수 있습니다. 최종 판정은 리뷰주체 의견을 종합하여 인사부서 협의로 확정합니다.',
  autoReco(total, risk) {
    let caution = 0, serious = 0;
    Object.keys(risk || {}).forEach(k => {
      const lv = risk[k] && risk[k].level;
      if (lv === '주의') caution++;
      if (lv === '중대') serious++;
    });
    const scoreTier = total >= 80 ? 4 : total >= 70 ? 3 : total >= 60 ? 2 : 1;
    const riskTier = serious > 0 ? 1 : caution >= 2 ? 2 : caution === 1 ? 3 : 4;
    return RECOMMENDATION_OPTIONS[4 - Math.min(scoreTier, riskTier)];
  },
  opinionTitle() { return '종합의견'; },
  noteGuide: '',
  splitOpinion: false,
  confirmText: '',
  reportScoreTitle: '역량리뷰 (100점 만점)',
  reportFootnote: '',
  finalRoles: []
};

const DEFAULT_ROLE_ORDER = ['현장소장', '공사책임자', '멘토', '동료'];

// 문자열/배열/객체 안의 모든 문구에 치환 적용 (함수·숫자는 그대로)
function deepReplace(v, reps) {
  if (typeof v === 'string') { let s = v; reps.forEach(([re, to]) => { s = s.replace(re, to); }); return s; }
  if (Array.isArray(v)) return v.map(x => deepReplace(x, reps));
  if (v && typeof v === 'object') { const o = {}; Object.keys(v).forEach(k => { o[k] = deepReplace(v[k], reps); }); return o; }
  return v;
}

/** 리뷰 유형 + 근무구분(현장/본사)에 맞는 문항 세트 */
const _rubricCache = {};
function getRubric(type, track) {
  const key = (type || '') + '|' + (track || '');
  if (_rubricCache[key]) return _rubricCache[key];
  let r = type === '수습종료' ? PROBATION_RUBRIC : INTERN_RUBRIC;
  if (type === '수습종료' && track === '본사') {
    const fns = { autoReco: r.autoReco, opinionTitle: r.opinionTitle, finalRoles: r.finalRoles };
    r = Object.assign(deepReplace(r, HQ_REPLACEMENTS), fns);
  }
  return (_rubricCache[key] = r);
}

/** 영역별 점수: 확정 점수(조정값)가 있으면 그것, 없으면 선택 단계의 환산 점수 */
function areaPoints(rubric, area, scores, confirmed) {
  const lv = area.levels.find(l => l.score === Number(scores[area.key]));
  if (!lv) return null;
  if (rubric.adjustable && confirmed && confirmed[area.key] !== undefined && confirmed[area.key] !== '' && !isNaN(Number(confirmed[area.key]))) {
    return Number(confirmed[area.key]);
  }
  return lv.converted;
}

// 5개 영역 합계 (선택된 영역만 집계, 몇 개 선택됐는지도 함께 반환)
function computeTotalScore(scores, rubric, confirmed) {
  rubric = rubric || INTERN_RUBRIC;
  let total = 0, scoredCount = 0;
  rubric.areas.forEach(area => {
    const p = areaPoints(rubric, area, scores, confirmed);
    if (p !== null) { total += p; scoredCount++; }
  });
  return { total, scoredCount, maxCount: rubric.areas.length };
}

// 합계 + 위험(저해)요인으로 추천의견(판정) 자동 계산. 5개 영역을 모두 선택해야 계산
function computeAutoRecommendation(scores, risk, rubric, confirmed) {
  rubric = rubric || INTERN_RUBRIC;
  const t = computeTotalScore(scores, rubric, confirmed);
  if (t.scoredCount < t.maxCount) return null;
  return rubric.autoReco(t.total, risk);
}

// 개별 리포트 HTML (report.html 화면 + 관리자 일괄 PDF 공용)
// data = 서버 report 응답 { intern, site, track, review, roles, records }
// ===================================================================
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** 종합의견 본문: 장점/개선사항으로 나눠 받은 경우 두 칸으로, 아니면 한 칸 */
function opinionBody(rb, rec) {
  const st = 'font-size:12.5px;color:#40495a;margin:4px 0;white-space:pre-wrap;';
  const pro = String(rec['장점'] || '').trim(), con = String(rec['개선사항'] || '').trim();
  if (rb.splitOpinion && (pro || con)) {
    return `<div style="${st}"><strong>장점</strong> · ${escHtml(pro || '-')}</div><div style="${st}"><strong>개선사항</strong> · ${escHtml(con || '-')}</div>`;
  }
  return `<div style="${st}">${escHtml(rec['종합의견'] || '')}</div>`;
}

function buildReportHtml(data) {
  const type = (data.review && data.review.reviewType) || '';
  const rb = getRubric(type, data.track);
  const records = data.records || [];
  const roles = (data.roles && data.roles.length) ? data.roles : DEFAULT_ROLE_ORDER.slice();
  const byRole = role => records.find(r => r['역할'] === role) || null;
  const isProb = rb.adjustable;
  const finalRole = roles.find(r => rb.finalRoles.indexOf(r) >= 0) || null;
  const firstRole = roles[0];
  const rawOf = (rec, area) => {
    if (!rec) return null;
    const f = AREA_FIELD_MAP.find(m => m[0] === area.key)[1];
    const v = Number(rec[f]);
    return area.levels.some(l => l.score === v) ? v : null;
  };
  const ptsOf = (rec, area) => {
    if (!rec) return null;
    const scores = {}; scores[area.key] = rawOf(rec, area);
    return areaPoints(rb, area, scores, rec['확정점수_JSON'] || {});
  };

  // ---- 점수표 ----
  const totals = {}; roles.forEach(r => totals[r] = null);
  let avgSum = 0, avgAny = false;
  const rows = rb.areas.map(area => {
    const cells = roles.map(role => {
      const rec = byRole(role);
      const p = ptsOf(rec, area);
      if (p !== null) totals[role] = (totals[role] || 0) + p;
      if (p === null) return '<td>-</td>';
      if (!isProb) return `<td>${p}점</td>`;
      const raw = rawOf(rec, area);
      const lv = area.levels.find(l => l.score === raw);
      const adj = lv && lv.converted !== p;
      return `<td>${p}점<br><span style="font-size:11px;color:#6b7484;">${raw}점·${escHtml(lv.grade)}${adj ? ' (조정)' : ''}</span></td>`;
    });
    let last;
    if (isProb) {
      const fp = finalRole ? ptsOf(byRole(finalRole), area) : null;
      last = `<td><strong>${fp !== null ? fp + '점' : '-'}</strong></td>`;
    } else {
      const vals = roles.map(r => ptsOf(byRole(r), area)).filter(v => v !== null);
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      if (avg !== null) { avgSum += avg; avgAny = true; }
      last = `<td><strong>${avg !== null ? avg.toFixed(1) + '점' : '-'}</strong></td>`;
    }
    // 멘토·확정평가자 체크가 2단계 이상 차이 → 협의 필요 표시
    let warn = '';
    if (isProb && finalRole && firstRole !== finalRole) {
      const a = rawOf(byRole(firstRole), area), b = rawOf(byRole(finalRole), area);
      if (a !== null && b !== null && Math.abs(a - b) >= 2) warn = ' <span style="color:#c0392b;font-weight:700;">⚠ 2단계 이상 차이</span>';
    }
    return `<tr>
      <td class="text-cell"><strong>${area.no} ${escHtml(area.title)}</strong>${warn}<br><span style="color:#6b7484;">배점 ${area.maxPoints}점</span></td>
      ${cells.join('')}${last}
    </tr>`;
  }).join('');
  const lastTotal = isProb
    ? (finalRole && totals[finalRole] !== null ? totals[finalRole] + '점' : '-')
    : (avgAny ? avgSum.toFixed(1) + '점' : '-');
  const totalRow = `<tr style="background:#f5f6f8;">
    <td class="text-cell"><strong>합계 (100점 만점)</strong></td>
    ${roles.map(r => `<td><strong>${totals[r] !== null ? totals[r] : '-'}</strong></td>`).join('')}
    <td><strong>${lastTotal}</strong></td>
  </tr>`;
  const lastHead = isProb ? `최종 확정${finalRole ? '<br><span style="font-weight:400;font-size:11px;">(' + escHtml(roleLabel(finalRole)) + ' 기준)</span>' : ''}` : '평균(환산)';
  const scoreTable = `
    <table class="report-table">
      <thead><tr><th style="text-align:left;">${isProb ? '평가영역' : '리뷰영역'}</th>${roles.map(r => `<th>${escHtml(roleLabel(r))}</th>`).join('')}<th>${lastHead}</th></tr></thead>
      <tbody>${rows}${totalRow}</tbody>
    </table>
    ${rb.reportFootnote ? `<p style="font-size:11.5px;color:#6b7484;margin-top:6px;">${escHtml(rb.reportFootnote)}</p>` : ''}`;

  // ---- 근거 ----
  const notes = rb.areas.map(area => {
    const nf = AREA_FIELD_MAP.find(m => m[0] === area.key)[2];
    const items = roles.map(role => {
      const rec = byRole(role);
      const note = rec ? rec[nf] : '';
      return note ? `<div style="margin-bottom:4px;"><strong>${escHtml(roleLabel(role))}</strong>: ${escHtml(note)}</div>` : '';
    }).filter(Boolean).join('');
    return items ? `<div style="margin-bottom:8px;"><div style="font-weight:700;font-size:12.5px;">${area.no} ${escHtml(area.title)} 근거</div>${items}</div>` : '';
  }).join('');

  // ---- 위험/저해요인 ----
  const riskRows = [];
  rb.riskItems.forEach((item, idx) => {
    roles.forEach(role => {
      const rec = byRole(role);
      if (!rec) return;
      const e = (rec['위험요인_JSON'] || {})[idx];
      if (e && e.level && e.level !== rb.riskLevels[0]) {
        riskRows.push(`<tr><td>${escHtml(item)}</td><td>${escHtml(roleLabel(role))}</td><td>${escHtml(e.level)}</td><td class="text-cell">${escHtml(e.detail || '')}</td></tr>`);
      }
    });
  });
  const riskHtml = riskRows.length
    ? `<table class="report-table"><thead><tr><th>${escHtml(rb.riskShort)}</th><th>리뷰자</th><th>단계</th><th style="text-align:left;">구체적 사실</th></tr></thead><tbody>${riskRows.join('')}</tbody></table>`
    : `<p style="font-size:13px;color:#1e8a5f;">체크된 ${escHtml(rb.riskShort)}이 없습니다.</p>`;

  // ---- 종합의견 ----
  const opinions = roles.map(role => {
    const rec = byRole(role);
    if (!rec) return `<div class="report-grid" style="margin-bottom:10px;"><div><span class="k">${escHtml(roleLabel(role))}</span> 미제출</div></div>`;
    return `
      <div style="margin-bottom:12px;">
        <div style="font-weight:700;font-size:13px;">${escHtml(isProb ? rb.opinionTitle(role) : roleLabel(role))} · ${escHtml(rec['평가자명'])}</div>
        ${opinionBody(rb, rec)}
        <div class="badge role">${isProb ? '판정' : '추천의견'}: ${escHtml(rec['평가자추천의견'] || '-')}</div>
      </div>`;
  }).join('');
  const finalRec = finalRole ? byRole(finalRole) : null;
  const finalLine = isProb
    ? `<div style="margin:6px 0 12px;font-size:13.5px;"><strong>최종 판정</strong> (${escHtml(finalRole ? roleLabel(finalRole) : '확정평가자')} 기준): <strong style="color:var(--navy, #1f3a6e);">${escHtml(finalRec ? (finalRec['평가자추천의견'] || '-') : '미제출')}</strong></div>`
    : '';

  // ---- 매트릭스 ----
  const hasAction = rb.matrix.some(m => m.action);
  const matrixNote = rb.id === '인턴전환'
    ? `허위보고, 무단결근, 부적절한 언행, 피드백 후 동일 문제 반복 등은 총점과 관계없이 미전환을 검토할 수 있습니다. 최종 판정은 ${roles.length}개 리뷰주체 의견을 종합하여 인사부서 협의로 확정합니다.`
    : rb.matrixNote;

  return `
    <h1>${escHtml((data.review && data.review.reviewTitle) || rb.formTitle)} 리포트</h1>
    <div class="sub">${roles.length}개 리뷰주체(${roles.map(r => escHtml(roleLabel(r))).join('/')}) 종합${isProb ? ' · ' + escHtml(rb.formTitle) : ''}</div>
    <div class="report-grid">
      <div><span class="k">성명</span><strong>${escHtml(data.intern)}</strong></div>
      <div><span class="k">${data.track === '본사' ? '소속' : '배치현장'}</span>${escHtml(data.site || '')}</div>
      <div><span class="k">제출 현황</span>${records.length} / ${roles.length}명</div>
    </div>
    <div class="report-section-title">${escHtml(rb.reportScoreTitle)}</div>
    ${scoreTable}
    <div class="report-section-title">영역별 근거 / 구체적 사례</div>
    <div style="font-size:12.5px;">${notes || '<p style="color:#6b7484;">기재된 근거가 없습니다.</p>'}</div>
    <div class="report-section-title">${escHtml(rb.riskTitle)}</div>
    ${riskHtml}
    <div class="report-section-title">${isProb ? '종합의견 및 ' + escHtml(rb.recoTitle) : '리뷰자별 종합의견 및 추천'}</div>
    ${finalLine}
    ${opinions}
    <div class="report-section-title">${escHtml(rb.matrixTitle)} 매트릭스 (참고)</div>
    <table class="report-table">
      <thead><tr><th>구분</th><th style="text-align:left;">기준</th>${hasAction ? '<th style="text-align:left;">조치</th>' : ''}</tr></thead>
      <tbody>${rb.matrix.map(m => `<tr><td><strong>${escHtml(m.label)}</strong></td><td class="text-cell">${escHtml(m.desc)}</td>${hasAction ? `<td class="text-cell">${escHtml(m.action || '')}</td>` : ''}</tr>`).join('')}</tbody>
    </table>
    <p style="font-size:11.5px;color:#6b7484;">${escHtml(matrixNote)}</p>`;
}

    topbar.style.display = 'flex';
    whoBox.innerHTML = `<button id="logoutBtn">로그아웃</button>
      <a href="index.html" style="margin-left:10px;color:#cfd8ea;font-size:12px;">← 리뷰자 화면</a>`;
    document.getElementById('logoutBtn').onclick = logout;
  }

  function logout() {
    if (state.token) apiPost({ action: 'logout', token: state.token }).catch(() => {});
    sessionStorage.removeItem('tr_admin_token');
    sessionStorage.removeItem('tr_admin_code'); // 이전 버전 잔여값 정리
    state = { token: '', view: 'login', reviews: [], reviewId: '', review: null, interns: [] };
    render();
  }

  function renderLogin() {
    appEl.innerHTML = `
    <div class="center-wrap">
      <div class="login-card">
        <div class="mark">관리</div>
        <h1>관리자 접속</h1>
        <p class="sub">인사담당자에게 전달받은 접속 코드를 입력하세요.</p>
        ${!configured() ? `<p class="error-msg" style="margin-bottom:14px;">⚠ 서버(Apps Script) 연결이 설정되지 않았습니다. config.js를 확인해주세요.</p>` : ''}
        <div class="field-row" style="text-align:left;">
          <input type="password" id="codeInput" placeholder="접속 코드" />
        </div>
        <button class="btn" id="loginBtn">입장</button>
        <div class="error-msg" id="loginError"></div>
      </div>
    </div>`;
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  }

  function doLogin() {
    const code = document.getElementById('codeInput').value.trim();
    const errEl = document.getElementById('loginError');
    if (!code) { errEl.textContent = '접속 코드를 입력해주세요.'; return; }
    apiPost({ action: 'adminLogin', code }).then(res => {
      if (!res.ok) { errEl.textContent = res.error || '접속 코드가 올바르지 않습니다.'; return; }
      state.token = res.token;
      sessionStorage.setItem('tr_admin_token', res.token);
      state.view = 'dashboard';
      loadDashboard();
    }).catch(() => { errEl.textContent = '서버에 연결할 수 없습니다.'; });
  }

  function loadDashboard() {
    appEl.innerHTML = `<div class="wrap"><div class="empty-state">불러오는 중...</div></div>`;
    updateTopbar();
    apiGet('adminReviews', { token: state.token }).then(rv => {
      if (!rv.ok) { logout(); return; }
      state.reviews = rv.reviews || [];
      if (!state.reviews.length) { state.review = null; state.interns = []; renderDashboard(); return; }
      let sel = state.reviews.find(r => r.reviewId === state.reviewId);
      if (!sel) sel = state.reviews.find(r => !r.closed) || state.reviews[0];
      return selectReview(sel.reviewId, true);
    }).catch(() => {
      appEl.innerHTML = `<div class="wrap"><div class="empty-state">서버에 연결할 수 없습니다. 새로고침(Ctrl+Shift+R) 해주세요.</div></div>`;
    });
  }

  function selectReview(id, silent) {
    state.reviewId = id;
    try { sessionStorage.setItem('tr_admin_review', id); } catch (e) {}
    return apiGet('adminData', { token: state.token, reviewId: id }).then(res => {
      if (!res.ok) { logout(); return; }
      state.review = res.review;
      state.interns = res.interns;
      renderDashboard();
    });
  }

  function renderReviewTree() {
    if (!state.reviews.length) return '<div class="card"><div class="empty-state">등록된 리뷰가 없습니다. Google Sheet의 \'리뷰목록\' 탭에 리뷰를 추가해주세요.</div></div>';
    const years = {};
    state.reviews.forEach(r => { (years[r.year] = years[r.year] || []).push(r); });
    const ys = Object.keys(years).sort((a, b) => b - a);
    const selYear = state.review ? String(state.review.year) : ys[0];
    return `<div class="card" style="margin-bottom:16px;">
      <div class="section-title">리뷰 선택</div>
      ${ys.map(y => `
      <details ${String(y) === selYear ? 'open' : ''} style="margin-bottom:6px;">
        <summary style="cursor:pointer;font-weight:700;padding:6px 0;">${escapeHtml(y)}년 <span style="font-weight:400;color:var(--muted);font-size:12px;">(${years[y].length}개)</span></summary>
        <div style="padding-left:12px;">
        ${years[y].map(r => `
          <div class="rv-item" data-rid="${escapeHtml(r.reviewId)}" style="cursor:pointer;padding:8px 10px;margin:4px 0;border:1px solid ${r.reviewId === state.reviewId ? 'var(--navy, #1f3a6e)' : '#dfe3ea'};background:${r.reviewId === state.reviewId ? '#eef3fb' : '#fff'};border-radius:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
            <span><strong>${escapeHtml(r.reviewTitle)}</strong> <span class="progress-pill ${r.closed ? 'zero' : 'full'}">${r.closed ? '마감' : '진행 중'}</span></span>
            <span style="font-size:12px;color:var(--muted);">${r.doneSlots} / ${r.totalSlots} 제출 · 마감 ${escapeHtml(fmtDeadline(r.deadline))}</span>
          </div>`).join('')}
        </div>
      </details>`).join('')}
    </div>`;
  }

  function renderDashboard() {
    if (!state.review) {
      appEl.innerHTML = `<div class="wrap">${renderReviewTree()}${renderOtpTool()}</div>`;
      bindOtpTool();
      return;
    }
    const total = state.interns.length;
    const fullyDone = state.interns.filter(i => i.doneCount === i.total).length;
    const totalSlots = state.interns.reduce((s, i) => s + i.total, 0);
    const doneSlots = state.interns.reduce((s, i) => s + i.doneCount, 0);

    appEl.innerHTML = `
    <div class="wrap">
      <div class="toolbar">
        <div class="hello">${escapeHtml(state.review.reviewTitle)} <span style="font-size:12.5px;font-weight:400;color:var(--muted);">마감 ${escapeHtml(fmtDeadline(state.review.deadline))}${state.review.closed ? ' · 마감됨' : ''}</span></div>
        <div class="actions">
          <button class="btn secondary small" id="refreshBtn">새로고침</button>
          <button class="btn secondary small" id="exportBtn">엑셀 다운로드</button>
          <button class="btn secondary small" id="bulkPdfBtn">리포트 일괄 PDF 다운로드</button>
        </div>
      </div>
      <div style="font-size:12.5px;color:var(--muted);text-align:right;margin-bottom:10px;display:none;" id="bulkPdfProgress"></div>
      ${renderReviewTree()}
      <div class="stat-row">
        <div class="stat-box"><div class="num">${total}</div><div class="lbl">전체 피리뷰자</div></div>
        <div class="stat-box"><div class="num">${fullyDone}</div><div class="lbl">배정 리뷰 모두 완료</div></div>
        <div class="stat-box"><div class="num">${doneSlots} / ${totalSlots}</div><div class="lbl">전체 제출 건수</div></div>
      </div>
      <table class="admin-table">
        <thead><tr><th>피리뷰자</th><th>배치현장/소속</th><th>진행률</th><th>리뷰자별 제출 현황</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      ${renderOtpTool()}
    </div>`;

    document.getElementById('bulkPdfBtn').onclick = downloadAllReportsZip;
    document.getElementById('refreshBtn').onclick = loadDashboard;
    document.getElementById('exportBtn').onclick = exportExcel;
    bindOtpTool();
    appEl.querySelectorAll('.rv-item').forEach(el => {
      el.onclick = () => {
        if (el.dataset.rid === state.reviewId) return;
        appEl.innerHTML = `<div class="wrap"><div class="empty-state">불러오는 중...</div></div>`;
        selectReview(el.dataset.rid);
      };
    });

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = state.interns.map(intern => {
      const pct = intern.doneCount === intern.total ? 'full' : (intern.doneCount === 0 ? 'zero' : 'partial');
      return `
      <tr>
        <td><strong>${escapeHtml(intern.intern)}</strong></td>
        <td>${escapeHtml(intern.site || '')}</td>
        <td><span class="progress-pill ${pct}">${intern.doneCount} / ${intern.total}</span></td>
        <td>${intern.roles.map(r => `<span class="role-chip ${r.submitted ? 'on' : ''}">${escapeHtml(roleLabel(r.role))}${r.submitted ? ' ✓' : ''}</span>`).join('')}</td>
        <td><button class="btn secondary small" data-intern="${escapeHtml(intern.intern)}">리포트 보기</button></td>
      </tr>`;
    }).join('');

    tbody.querySelectorAll('button[data-intern]').forEach(btn => {
      btn.onclick = () => {
        window.location.href = `report.html?intern=${encodeURIComponent(btn.dataset.intern)}&review=${encodeURIComponent(state.reviewId)}`;
      };
    });
  }

  // ---------- 리포트 HTML 조립 (report.html과 동일한 buildReportHtml 사용, PDF 일괄생성용) ----------
  function buildReportInnerHtml(data) { return buildReportHtml(data); }

  // ---------- 전체 리포트 일괄 PDF(zip) 다운로드 ----------
  function downloadAllReportsZip() {
    const targets = state.interns.filter(i => i.doneCount > 0);
    if (!targets.length) { alert('제출된 리뷰가 있는 피리뷰자가 없습니다.'); return; }

    const btn = document.getElementById('bulkPdfBtn');
    const progressEl = document.getElementById('bulkPdfProgress');
    btn.disabled = true;
    progressEl.style.display = 'block';
    progressEl.textContent = '준비 중...';

    const holder = document.createElement('div');
    holder.style.position = 'fixed';
    holder.style.left = '-9999px';
    holder.style.top = '0';
    holder.style.width = '820px';
    holder.className = 'report-page';
    document.body.appendChild(holder);

    const zip = new JSZip();
    const { jsPDF } = window.jspdf;

    let idx = 0;
    function next() {
      if (idx >= targets.length) {
        document.body.removeChild(holder);
        progressEl.textContent = '압축 중...';
        zip.generateAsync({ type: 'blob' }).then(blob => {
          const a = document.createElement('a');
          const ts = new Date().toISOString().slice(0, 10);
          a.href = URL.createObjectURL(blob);
          a.download = `${safeName((state.review && state.review.reviewTitle) || '리뷰')}_리포트_전체_${ts}.zip`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          btn.disabled = false;
          progressEl.style.display = 'none';
        });
        return;
      }
      const intern = targets[idx].intern;
      progressEl.textContent = `리포트 생성 중... (${idx + 1}/${targets.length}) ${intern}`;
      apiGet('report', { token: state.token, intern, reviewId: state.reviewId }).then(res => {
        if (!res.ok) { idx++; next(); return; }
        holder.innerHTML = buildReportInnerHtml(res);
        html2canvas(holder, { scale: 2, useCORS: true }).then(canvas => {
          const imgData = canvas.toDataURL('image/jpeg', 0.92);
          const pdf = new jsPDF({ unit: 'px', format: [canvas.width, canvas.height] });
          pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
          const pdfBlob = pdf.output('blob');
          zip.file(`${intern}_리뷰리포트.pdf`, pdfBlob);
          idx++;
          next();
        }).catch(() => { idx++; next(); });
      }).catch(() => { idx++; next(); });
    }
    next();
  }

  function safeName(t) { return String(t).replace(/[\\/:*?"<>|]/g, '').trim(); }

  function exportExcel() {
    apiGet('adminAllRecords', { token: state.token, reviewId: state.reviewId }).then(res => {
      if (!res.ok) { alert(res.error || '내보내기에 실패했습니다.'); return; }
      const records = res.records;
      if (!records.length) { alert('아직 제출된 리뷰가 없습니다.'); return; }
      const type = (state.review && state.review.reviewType) || '';
      const rbBase = getRubric(type, '현장'); // 열 이름은 공통(현장) 문구 기준
      const isProb = rbBase.adjustable;
      const trackOf = name => { const it = state.interns.find(i => i.intern === name); return (it && it.track) || '현장'; };
      const rows = records.map(r => {
        let risk = {}, confirmed = {};
        try { risk = JSON.parse(r['위험요인_JSON'] || '{}'); } catch (e) {}
        try { confirmed = JSON.parse(r['확정점수_JSON'] || '{}'); } catch (e) {}
        const rb = getRubric(type, trackOf(r['피평가자']));
        const flagged = Object.keys(risk).filter(i => risk[i] && risk[i].level && risk[i].level !== rb.riskLevels[0]);
        const riskSummary = flagged.map(i => `${rb.riskItems[i] || ('항목' + i)}(${risk[i].level})`).join('; ');

        const row = {
          '리뷰명': r['리뷰명'] || (state.review && state.review.reviewTitle) || '',
          '제출시각': r['제출시각'],
          '사번': r['사번'],
          '리뷰자명': r['평가자명'],
          '역할': roleLabel(r['역할']),
          '피리뷰자': r['피평가자']
        };
        if (isProb) row['구분'] = trackOf(r['피평가자']);
        let total = 0;
        AREA_FIELD_MAP.forEach(([key, scoreField, noteField], idx) => {
          const area = rbBase.areas[idx];
          const scores = {}; scores[key] = Number(r[scoreField]);
          const p = areaPoints(rbBase, area, scores, confirmed);
          if (p !== null) total += p;
          if (isProb) row[`${area.no}${area.title}_체크(1~4)`] = r[scoreField] || '';
          row[`${area.no}${area.title}_${isProb ? '확정점수' : '환산점수'}`] = p !== null ? p : '';
          row[`${area.no}${area.title}_근거`] = r[noteField] || '';
        });
        row['합계(100점만점)'] = total;
        row[isProb ? '저해요인_요약' : '위험요인_요약'] = riskSummary;
        if (isProb) {
          row['종합의견_장점'] = r['장점'] || (r['개선사항'] ? '' : (r['종합의견'] || ''));
          row['종합의견_개선사항'] = r['개선사항'] || '';
        } else {
          row['종합의견'] = r['종합의견'] || '';
        }
        row[isProb ? '육성관리판정' : '리뷰자추천의견'] = r['평가자추천의견'] || '';
        return row;
      });
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '리뷰결과(환산)');
      const ts = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `${safeName((state.review && state.review.reviewTitle) || '리뷰')}_결과_${ts}.xlsx`);
    });
  }

  function renderOtpTool() {
    return `
    <div class="card" style="margin-top:24px;">
      <div class="section-title">테스트용 인증번호 발급</div>
      <div class="page-desc" style="margin-bottom:10px;">리뷰자 사번을 넣고 발급하면, <strong>해당 리뷰자에게는 메일이 가지 않고</strong> 여기 화면에만 인증번호가 표시됩니다. 발급 후 리뷰자 사이트(index.html) 로그인 화면 하단의 <strong>"관리자에게 받은 인증번호가 있으신가요?"</strong> 링크를 눌러 사번+인증번호를 바로 입력하면 로그인됩니다. (10분간 유효)</div>
      <div style="display:flex;gap:8px;max-width:360px;">
        <input type="text" id="otpTestSabun" placeholder="사번 입력" style="flex:1;" inputmode="numeric" />
        <button class="btn secondary small" id="otpTestBtn">발급</button>
      </div>
      <div id="otpTestResult" style="margin-top:10px;font-size:13px;"></div>
    </div>`;
  }

  function bindOtpTool() {
    const btn = document.getElementById('otpTestBtn');
    if (!btn) return;
    btn.onclick = () => {
      const sabun = document.getElementById('otpTestSabun').value.trim();
      const resultEl = document.getElementById('otpTestResult');
      resultEl.textContent = '';
      if (!sabun) { resultEl.innerHTML = '<span style="color:var(--bad);">사번을 입력해주세요.</span>'; return; }
      apiGet('adminIssueOtp', { token: state.token, sabun }).then(res => {
        if (!res.ok) { resultEl.innerHTML = `<span style="color:var(--bad);">${escapeHtml(res.error || '발급 실패')}</span>`; return; }
        resultEl.innerHTML = `<strong>${escapeHtml(res.name)}</strong>님 인증번호: <span style="font-size:18px;font-weight:800;color:var(--navy);letter-spacing:2px;">${escapeHtml(res.otp)}</span> <span style="color:var(--muted);">(10분간 유효, 메일 발송 없음)</span>`;
      });
    };
  }

  function render() {
    updateTopbar();
    if (state.view === 'login') renderLogin();
    else loadDashboard();
  }

  render();
})();

</script>
</body>
