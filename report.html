<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>평가 리포트 · 채용연계형 인턴 평가</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root {
  --navy: #16233f;
  --navy-2: #223761;
  --accent: #2f6feb;
  --accent-soft: #e8f0ff;
  --ink: #1c222c;
  --muted: #6b7484;
  --line: #e3e6ec;
  --bg: #f5f6f8;
  --card: #ffffff;
  --good: #1e8a5f;
  --warn: #b8860b;
  --bad: #c0392b;
  --radius: 10px;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  font-size: 15px;
}

a { color: inherit; }

.topbar {
  background: var(--navy);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar .brand {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.2px;
}
.topbar .brand small {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: #aab7cf;
  margin-top: 2px;
}
.topbar .who { font-size: 13px; color: #cfd8ea; }
.topbar .who button {
  margin-left: 12px;
  background: transparent;
  color: #fff;
  border: 1px solid #445580;
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 12px;
}
.topbar .who button:hover { background: #223761; }

.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}

.center-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(22, 35, 63, 0.10);
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.login-card .mark {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; margin: 0 auto 18px;
}
.login-card h1 { font-size: 18px; margin: 0 0 4px; }
.login-card p.sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

input[type="text"], input[type="password"], textarea, select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  color: var(--ink);
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--accent);
}
textarea { resize: vertical; min-height: 70px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  width: 100%;
}
.btn:hover { background: #2557c4; }
.btn:disabled { background: #b7c4de; cursor: not-allowed; }
.btn.secondary {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
  width: auto;
}
.btn.secondary:hover { background: #f0f2f5; }
.btn.small { padding: 6px 12px; font-size: 12.5px; width: auto; }

.error-msg {
  color: var(--bad);
  font-size: 13px;
  margin-top: 10px;
  min-height: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 4px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.section-title .pts { font-weight: 400; font-size: 12.5px; color: var(--muted); }

.report-section-title {
  font-size: 14px;
  font-weight: 700;
  background: #e6e6e6;
  padding: 8px 12px;
  margin: 18px 0 10px;
  border-radius: 4px;
}
.report-section-title:first-of-type { margin-top: 4px; }

.hello { font-size: 15px; margin-bottom: 2px; }
.hello strong { color: var(--navy); }
.page-desc { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

.assign-list { display: flex; flex-direction: column; gap: 10px; }
.assign-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px;
}
.assign-item .info { display: flex; flex-direction: column; gap: 2px; }
.assign-item .intern-name { font-weight: 700; font-size: 15px; }
.assign-item .meta { font-size: 12.5px; color: var(--muted); }
.badge {
  font-size: 11.5px; font-weight: 600; border-radius: 20px; padding: 3px 10px;
  background: var(--accent-soft); color: var(--accent);
}
.badge.role { background: #eef0f4; color: var(--muted); margin-right: 6px; }
.badge.done { background: #e5f6ee; color: var(--good); }
.badge.pending { background: #fdf1e0; color: var(--warn); }

.level-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 6px; }
.level-option {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  cursor: pointer; transition: border-color .12s, background .12s;
}
.level-option:hover { border-color: #b9c5dd; }
.level-option.selected { border-color: var(--accent); background: var(--accent-soft); }
.level-option input { margin-top: 3px; }
.level-option .lv-head { font-weight: 700; font-size: 13.5px; }
.level-option .lv-text { font-size: 13px; color: #40495a; margin-top: 2px; }
.level-option .lv-pts { font-size: 12px; color: var(--muted); margin-left: 6px; font-weight: 400; }

.note-field { margin-top: 10px; }
.note-field label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }

.risk-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.risk-table th, .risk-table td { border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: left; vertical-align: top; }
.risk-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.risk-radio-group { display: flex; gap: 12px; }
.risk-radio-group label { display: flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
.risk-detail { width: 100%; }

.field-row { margin-bottom: 16px; }
.field-row label.field-label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }

.reco-group { display: flex; gap: 8px; flex-wrap: wrap; }
.reco-group label {
  border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer;
}
.reco-group input { display: none; }
.reco-group label.selected { background: var(--navy); color: #fff; border-color: var(--navy); }

.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

table.admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #fff; }
table.admin-table th, table.admin-table td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; }
table.admin-table th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
table.admin-table tr:hover td { background: #fafbfc; }
.progress-pill { font-weight: 700; }
.progress-pill.full { color: var(--good); }
.progress-pill.partial { color: var(--warn); }
.progress-pill.zero { color: var(--muted); }

.role-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 8px; border-radius: 20px; margin-right: 4px; margin-bottom: 4px; background: #eef0f4; color: var(--muted); }
.role-chip.on { background: #e5f6ee; color: var(--good); }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
.toolbar .actions { display: flex; gap: 8px; }

.stat-row { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-box { flex: 1; min-width: 140px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.stat-box .num { font-size: 26px; font-weight: 800; color: var(--navy); }
.stat-box .lbl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* Report / print */
.report-page {
  background: #fff;
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 44px;
  border: 1px solid var(--line);
}
.report-page h1 { font-size: 20px; margin: 0 0 2px; }
.report-page .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
.report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 24px; margin-bottom: 18px; font-size: 13px; }
.report-grid div span.k { color: var(--muted); margin-right: 6px; }
.report-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 16px; }
.report-table th, .report-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
.report-table th { background: #f5f6f8; }
.report-table td.text-cell { text-align: left; font-size: 12px; }
.report-final { font-size: 14px; font-weight: 700; margin-top: 6px; }

@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
  .report-page { border: none; padding: 0; }
}

.empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }

.loading-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 4px; }

</style>
</head>
<body>

<div class="wrap no-print" style="max-width:820px;">

</div>
<div id="app"></div>

];

const ROLE_LABELS = {
  '현장소장': '현장소장',
  '공사책임자': '공사책임자',
  '멘토': '멘토',
  '동료': '동료'
};


    // ==== config.js (Apps Script 배포 URL은 여기서 수정) ====
// Google Apps Script 웹앱 배포 후 발급되는 URL을 아래에 붙여넣으세요.
// 예: https://script.google.com/macros/s/AKfycbx.../exec
// 설정 방법은 README.md의 "3. Apps Script 배포" 참고
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxVe9ulY_-ymlUjnsgvgGg3dwZZIDI9QH26Mb2bAvNasQol_ZSZUOCBLVDO238338_Y/exec'
};


    // ==== report.js ====
(function () {
  const appEl = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const internName = params.get('intern');
  const code = sessionStorage.getItem('tr_admin_code');

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  if (!code) {
    window.location.href = 'admin.html';
    return;
  }
  if (!internName) {
    appEl.innerHTML = `<div class="wrap"><div class="empty-state">인턴명이 지정되지 않았습니다.</div></div>`;
    return;
  }

  function apiGet(action, p) {
    const url = new URL(CONFIG.API_URL);
    url.searchParams.set('action', action);
    Object.keys(p || {}).forEach(k => url.searchParams.set(k, p[k]));
    return fetch(url.toString()).then(r => r.json());
  }

  const ROLE_ORDER = ['현장소장', '공사책임자', '멘토', '동료'];

  apiGet('report', { code, intern: internName }).then(res => {
    if (!res.ok) {
      if (String(res.error || '').indexOf('코드') !== -1) { window.location.href = 'admin.html'; return; }
      appEl.innerHTML = `<div class="wrap"><div class="empty-state">${escapeHtml(res.error || '불러오기 실패')}</div></div>`;
      return;
    }
    renderReport(res);
  }).catch(() => {
    appEl.innerHTML = `<div class="wrap"><div class="empty-state">서버에 연결할 수 없습니다.</div></div>`;
  });

  function byRole(records, role) {
    return records.find(r => r['역할'] === role) || null;
  }

  function convertedScore(area, rawScore) {
    const lv = area.levels.find(l => l.score === Number(rawScore));
    return lv ? lv.converted : null;
  }

  function scoreTable(records) {
    let totalByRole = {};
    ROLE_ORDER.forEach(r => totalByRole[r] = 0);
    let grandAvgSum = 0;

    let rows = RUBRIC_AREAS.map(area => {
      const scoreField = AREA_FIELD_MAP.find(m => m[0] === area.key)[1];
      const convertedByRole = ROLE_ORDER.map(role => {
        const rec = byRole(records, role);
        const raw = rec ? rec[scoreField] : '';
        const conv = raw ? convertedScore(area, raw) : null;
        if (conv !== null) totalByRole[role] += conv;
        return conv;
      });
      const cells = convertedByRole.map(conv => `<td>${conv !== null ? conv + '점' : '-'}</td>`);
      const validConv = convertedByRole.filter(c => c !== null);
      const avg = validConv.length ? (validConv.reduce((a, b) => a + b, 0) / validConv.length) : null;
      if (avg !== null) grandAvgSum += avg;
      return `<tr>
        <td class="text-cell"><strong>${area.no} ${escapeHtml(area.title)}</strong><br><span style="color:#6b7484;">배점 ${area.maxPoints}점</span></td>
        ${cells.join('')}
        <td><strong>${avg !== null ? avg.toFixed(1) + '점' : '-'}</strong></td>
      </tr>`;
    }).join('');

    const totalRow = `<tr style="background:#f5f6f8;">
      <td class="text-cell"><strong>합계 (100점 만점)</strong></td>
      ${ROLE_ORDER.map(role => `<td><strong>${totalByRole[role] || '-'}</strong></td>`).join('')}
      <td><strong>${grandAvgSum ? grandAvgSum.toFixed(1) + '점' : '-'}</strong></td>
    </tr>`;

    return `
    <table class="report-table">
      <thead><tr><th style="text-align:left;">평가영역</th>${ROLE_ORDER.map(r => `<th>${r}</th>`).join('')}<th>평균(환산)</th></tr></thead>
      <tbody>${rows}${totalRow}</tbody>
    </table>`;
  }

  function notesBlock(records) {
    return RUBRIC_AREAS.map(area => {
      const noteField = AREA_FIELD_MAP.find(m => m[0] === area.key)[2];
      const items = ROLE_ORDER.map(role => {
        const rec = byRole(records, role);
        const note = rec ? rec[noteField] : '';
        if (!note) return '';
        return `<div style="margin-bottom:4px;"><strong>${role}</strong>: ${escapeHtml(note)}</div>`;
      }).filter(Boolean).join('');
      if (!items) return '';
      return `<div style="margin-bottom:8px;"><div style="font-weight:700;font-size:12.5px;">${area.no} ${escapeHtml(area.title)} 근거</div>${items}</div>`;
    }).join('');
  }

  function riskBlock(records) {
    const rows = [];
    RISK_ITEMS.forEach((item, idx) => {
      ROLE_ORDER.forEach(role => {
        const rec = byRole(records, role);
        if (!rec) return;
        const risk = rec['위험요인_JSON'] || {};
        const entry = risk[idx];
        if (entry && entry.level && entry.level !== '해당없음') {
          rows.push(`<tr><td>${escapeHtml(item)}</td><td>${role}</td><td>${entry.level}</td><td class="text-cell">${escapeHtml(entry.detail || '')}</td></tr>`);
        }
      });
    });
    if (!rows.length) return `<p style="font-size:13px;color:#1e8a5f;">체크된 위험요인이 없습니다.</p>`;
    return `
    <table class="report-table">
      <thead><tr><th>위험요인</th><th>평가자</th><th>단계</th><th style="text-align:left;">구체적 사실</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>`;
  }

  function opinionsBlock(records) {
    return ROLE_ORDER.map(role => {
      const rec = byRole(records, role);
      if (!rec) return `<div class="report-grid" style="margin-bottom:10px;"><div><span class="k">${role}</span> 미제출</div></div>`;
      return `
      <div style="margin-bottom:12px;">
        <div style="font-weight:700;font-size:13px;">${role} (${escapeHtml(rec['평가자명'])})</div>
        <div style="font-size:12.5px;color:#40495a;margin:4px 0;">${escapeHtml(rec['종합의견'] || '')}</div>
        <div class="badge role">추천의견: ${escapeHtml(rec['평가자추천의견'] || '-')}</div>
      </div>`;
    }).join('');
  }

  function renderReport(data) {
    const records = data.records;
    document.getElementById('printBtn').onclick = () => window.print();

    appEl.innerHTML = `
    <div class="report-page">
      <h1>채용연계형 인턴 역량평가 리포트</h1>
      <div class="sub">정규직 전환 심의용 · 4개 평가주체(현장소장/공사책임자/멘토/동료) 종합</div>
      <div class="report-grid">
        <div><span class="k">성명</span><strong>${escapeHtml(data.intern)}</strong></div>
        <div><span class="k">배치현장</span>${escapeHtml(data.site || '')}</div>
        <div><span class="k">제출 현황</span>${records.length} / 4명</div>
      </div>

      <div class="report-section-title">역량평가 (100점 만점)</div>
      ${scoreTable(records)}

      <div class="report-section-title">영역별 근거 / 구체적 사례</div>
      <div style="font-size:12.5px;">${notesBlock(records) || '<p style="color:#6b7484;">기재된 근거가 없습니다.</p>'}</div>

      <div class="report-section-title">위험요인 체크리스트</div>
      ${riskBlock(records)}

      <div class="report-section-title">평가자별 종합의견 및 추천</div>
      ${opinionsBlock(records)}

      <div class="report-section-title">전환기준 매트릭스 (참고)</div>
      <table class="report-table">
        <thead><tr><th>구분</th><th style="text-align:left;">기준</th></tr></thead>
        <tbody>
        ${TRANSITION_MATRIX.map(m => `<tr><td><strong>${m.label}</strong></td><td class="text-cell">${escapeHtml(m.desc)}</td></tr>`).join('')}
        </tbody>
      </table>
      <p style="font-size:11.5px;color:#6b7484;">허위보고, 무단결근, 부적절한 언행, 피드백 후 동일 문제 반복 등은 총점과 관계없이 미전환을 검토할 수 있습니다. 최종 판정은 4개 평가주체 의견을 종합하여 인사부서 협의로 확정합니다.</p>
    </div>`;
  }
})();

</script>
</body>
</html>
