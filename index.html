<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인턴·신입사원 리뷰</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root {
  --navy: #16233f;
  --navy-2: #223761;
  --accent: #2f6feb;
  --accent-soft: #e8f0ff;
  --ink: #1c222c;
  --muted: #6b7484;
  --line: #e3e6ec;
  --bg: #f5f6f8;
  --card: #ffffff;
  --good: #1e8a5f;
  --warn: #b8860b;
  --bad: #c0392b;
  --radius: 10px;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  font-size: 15px;
}

a { color: inherit; }

.topbar {
  background: var(--navy);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar .brand {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.2px;
}
.topbar .brand small {
  display: block;
  font-weight: 400;
  font-size: 12px;
  color: #aab7cf;
  margin-top: 2px;
}
.topbar .who { font-size: 13px; color: #cfd8ea; }
.topbar .who button {
  margin-left: 12px;
  background: transparent;
  color: #fff;
  border: 1px solid #445580;
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 12px;
}
.topbar .who button:hover { background: #223761; }

.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}

.center-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(22, 35, 63, 0.10);
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.login-card .mark {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; margin: 0 auto 18px;
}
.login-card h1 { font-size: 18px; margin: 0 0 4px; }
.login-card p.sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

input[type="text"], input[type="password"], textarea, select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  color: var(--ink);
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--accent);
}
textarea { resize: vertical; min-height: 70px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  width: 100%;
}
.btn:hover { background: #2557c4; }
.btn:disabled { background: #b7c4de; cursor: not-allowed; }
.btn.secondary {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
  width: auto;
}
.btn.secondary:hover { background: #f0f2f5; }
.btn.small { padding: 6px 12px; font-size: 12.5px; width: auto; }

.error-msg {
  color: var(--bad);
  font-size: 13px;
  margin-top: 10px;
  min-height: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 4px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.section-title .pts { font-weight: 400; font-size: 12.5px; color: var(--muted); }

.hello { font-size: 15px; margin-bottom: 2px; }
.hello strong { color: var(--navy); }
.page-desc { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

.assign-list { display: flex; flex-direction: column; gap: 10px; }
.assign-item {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px;
}
.assign-item .info { display: flex; flex-direction: column; gap: 2px; }
.assign-item .intern-name { font-weight: 700; font-size: 15px; }
.assign-item .meta { font-size: 12.5px; color: var(--muted); }
.badge {
  font-size: 11.5px; font-weight: 600; border-radius: 20px; padding: 3px 10px;
  background: var(--accent-soft); color: var(--accent);
}
.badge.role { background: #eef0f4; color: var(--muted); margin-right: 6px; }
.badge.done { background: #e5f6ee; color: var(--good); }
.badge.pending { background: #fdf1e0; color: var(--warn); }

.level-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 6px; }
.level-option {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  cursor: pointer; transition: border-color .12s, background .12s;
}
.level-option:hover { border-color: #b9c5dd; }
.level-option.selected { border-color: var(--accent); background: var(--accent-soft); }
.level-option input { margin-top: 3px; }
.level-option .lv-head { font-weight: 700; font-size: 13.5px; }
.level-option .lv-text { font-size: 13px; color: #40495a; margin-top: 2px; }
.level-option .lv-pts { font-size: 12px; color: var(--muted); margin-left: 6px; font-weight: 400; }

.note-field { margin-top: 10px; }
.note-field label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }

.risk-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.risk-table th, .risk-table td { border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: left; vertical-align: top; }
.risk-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.risk-radio-group { display: flex; gap: 12px; }
.risk-radio-group label { display: flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
.risk-detail { width: 100%; }

.field-row { margin-bottom: 16px; }
.field-row label.field-label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }

.reco-group { display: flex; gap: 8px; flex-wrap: wrap; }
.reco-group label {
  border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer;
}
.reco-group input { display: none; }
.reco-group label.selected { background: var(--navy); color: #fff; border-color: var(--navy); }

.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

table.admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #fff; }
table.admin-table th, table.admin-table td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; }
table.admin-table th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
table.admin-table tr:hover td { background: #fafbfc; }
.progress-pill { font-weight: 700; }
.progress-pill.full { color: var(--good); }
.progress-pill.partial { color: var(--warn); }
.progress-pill.zero { color: var(--muted); }

.role-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 8px; border-radius: 20px; margin-right: 4px; margin-bottom: 4px; background: #eef0f4; color: var(--muted); }
.role-chip.on { background: #e5f6ee; color: var(--good); }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
.toolbar .actions { display: flex; gap: 8px; }

.stat-row { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-box { flex: 1; min-width: 140px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.stat-box .num { font-size: 26px; font-weight: 800; color: var(--navy); }
.stat-box .lbl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* Report / print */
.report-page {
  background: #fff;
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 44px;
  border: 1px solid var(--line);
}
.report-page h1 { font-size: 20px; margin: 0 0 2px; }
.report-page .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
.report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 24px; margin-bottom: 18px; font-size: 13px; }
.report-grid div span.k { color: var(--muted); margin-right: 6px; }
.report-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 16px; }
.report-table th, .report-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
.report-table th { background: #f5f6f8; }
.report-table td.text-cell { text-align: left; font-size: 12px; }
.report-final { font-size: 14px; font-weight: 700; margin-top: 6px; }

@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
  .report-page { border: none; padding: 0; }
}

.empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }

.loading-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 4px; }

</style>
</head>

  confirmText: '본인은 본 평가가 수습사원의 정식 배치 후 육성관리 방향 수립에 활용되는 공식 평가임을 인지하고 있습니다. 본 평가는 개인적 호감, 추측, 인상이 아니라 수습기간 중 관찰된 행동, 업무수행 사실, 피드백 결과를 기준으로 작성하였습니다. 특히 우수 또는 집중관리 평가를 부여한 항목과 성장 저해요인으로 체크한 항목에 대해서는 구체적인 근거를 바탕으로 평가하였음을 확인합니다.',
  reportScoreTitle: '수습·OJT 평가 (100점 만점, 확정 점수)',
  reportFootnote: '최종 확정 점수는 현장소장 확정 점수를 원칙으로 하며, 멘토·현장소장 체크가 다른 항목은 근거란에 조정 사유를 기재합니다. 체크가 2단계 이상 차이나는 영역(⚠)은 현장소장·인사부서 협의를 거쳐 확정합니다.',
  finalRoles: ['현장소장', '팀장'] // 최종 확정 점수의 기준이 되는 역할
};

// 본사 인원용 문구 치환 (현장 → 본사, 현장소장 → 팀장 등). 위에서부터 순서대로 적용
const HQ_REPLACEMENTS = [
  [/현장소장/g, '팀장'],
  [/배치현장/g, '소속'],
  [/공정·품질·도면 등/g, '업무 프로세스·규정·시스템 등'],
  [/공정\/품질\/도면/g, '업무 프로세스/규정/시스템'],
  [/직무\(공종\)/g, '직무'],
  [/건축현장/g, '본사'],
  [/현장/g, '본사']
];

// 기존 인턴 리뷰 문항 세트 (위 상수 그대로 사용)
const INTERN_RUBRIC = {
  id: '인턴전환',
  formTitle: '역량리뷰',
  intro: '',
  guide: [],
  scale: SCALE_DESC,
  scaleNote: '',
  adjustable: false,
  areas: RUBRIC_AREAS,
  riskTitle: '위험요인 체크리스트',
  riskShort: '위험요인',
  riskGuide: "'주의' 또는 '중대'로 체크한 항목은 구체적 사실(발생시점·상황·지도내용·개선여부)을 반드시 작성합니다. 위험요인은 점수로 상쇄하지 않습니다.",
  riskItems: RISK_ITEMS,
  riskCriteria: RISK_CRITERIA,
  riskLevels: RISK_LEVELS,
  riskMild: '주의', riskSevere: '중대',
  recoTitle: '리뷰자 추천의견',
  recoGuide: '5개 영역 점수와 위험요인을 바탕으로 아래 매트릭스에 따라 자동 계산됩니다. 필요하면 직접 다른 항목을 선택해 조정할 수 있습니다.',
  recoOptions: RECOMMENDATION_OPTIONS,
  matrixTitle: '전환기준',
  matrix: TRANSITION_MATRIX,
  matrixNote: '허위보고, 무단결근, 부적절한 언행, 피드백 후 동일 문제 반복 등은 총점과 관계없이 미전환을 검토할 수 있습니다. 최종 판정은 리뷰주체 의견을 종합하여 인사부서 협의로 확정합니다.',
  autoReco(total, risk) {
    let caution = 0, serious = 0;
    Object.keys(risk || {}).forEach(k => {
      const lv = risk[k] && risk[k].level;
      if (lv === '주의') caution++;
      if (lv === '중대') serious++;
    });
    const scoreTier = total >= 80 ? 4 : total >= 70 ? 3 : total >= 60 ? 2 : 1;
    const riskTier = serious > 0 ? 1 : caution >= 2 ? 2 : caution === 1 ? 3 : 4;
    return RECOMMENDATION_OPTIONS[4 - Math.min(scoreTier, riskTier)];
  },
  opinionTitle() { return '종합의견'; },
  noteGuide: '',
  splitOpinion: false,
  confirmText: '',
  reportScoreTitle: '역량리뷰 (100점 만점)',
  reportFootnote: '',
  finalRoles: []
};

const DEFAULT_ROLE_ORDER = ['현장소장', '공사책임자', '멘토', '동료'];

// 문자열/배열/객체 안의 모든 문구에 치환 적용 (함수·숫자는 그대로)
function deepReplace(v, reps) {
  if (typeof v === 'string') { let s = v; reps.forEach(([re, to]) => { s = s.replace(re, to); }); return s; }
  if (Array.isArray(v)) return v.map(x => deepReplace(x, reps));
  if (v && typeof v === 'object') { const o = {}; Object.keys(v).forEach(k => { o[k] = deepReplace(v[k], reps); }); return o; }
  return v;
}

/** 리뷰 유형 + 근무구분(현장/본사)에 맞는 문항 세트 */
const _rubricCache = {};
function getRubric(type, track) {
  const key = (type || '') + '|' + (track || '');
  if (_rubricCache[key]) return _rubricCache[key];
  let r = type === '수습종료' ? PROBATION_RUBRIC : INTERN_RUBRIC;
  if (type === '수습종료' && track === '본사') {
    const fns = { autoReco: r.autoReco, opinionTitle: r.opinionTitle, finalRoles: r.finalRoles };
    r = Object.assign(deepReplace(r, HQ_REPLACEMENTS), fns);
  }
  return (_rubricCache[key] = r);
}

/** 영역별 점수: 확정 점수(조정값)가 있으면 그것, 없으면 선택 단계의 환산 점수 */
function areaPoints(rubric, area, scores, confirmed) {
  const lv = area.levels.find(l => l.score === Number(scores[area.key]));
  if (!lv) return null;
  if (rubric.adjustable && confirmed && confirmed[area.key] !== undefined && confirmed[area.key] !== '' && !isNaN(Number(confirmed[area.key]))) {
    return Number(confirmed[area.key]);
  }
  return lv.converted;
}

// 5개 영역 합계 (선택된 영역만 집계, 몇 개 선택됐는지도 함께 반환)
function computeTotalScore(scores, rubric, confirmed) {
  rubric = rubric || INTERN_RUBRIC;
  let total = 0, scoredCount = 0;
  rubric.areas.forEach(area => {
    const p = areaPoints(rubric, area, scores, confirmed);
    if (p !== null) { total += p; scoredCount++; }
  });
  return { total, scoredCount, maxCount: rubric.areas.length };
}

// 합계 + 위험(저해)요인으로 추천의견(판정) 자동 계산. 5개 영역을 모두 선택해야 계산
function computeAutoRecommendation(scores, risk, rubric, confirmed) {
  rubric = rubric || INTERN_RUBRIC;
  const t = computeTotalScore(scores, rubric, confirmed);
  if (t.scoredCount < t.maxCount) return null;
  return rubric.autoReco(t.total, risk);
}

// 개별 리포트 HTML (report.html 화면 + 관리자 일괄 PDF 공용)
// data = 서버 report 응답 { intern, site, track, review, roles, records }
// ===================================================================
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** 종합의견 본문: 장점/개선사항으로 나눠 받은 경우 두 칸으로, 아니면 한 칸 */
function opinionBody(rb, rec) {
  const st = 'font-size:12.5px;color:#40495a;margin:4px 0;white-space:pre-wrap;';
  const pro = String(rec['장점'] || '').trim(), con = String(rec['개선사항'] || '').trim();
  if (rb.splitOpinion && (pro || con)) {
    return `<div style="${st}"><strong>장점</strong> · ${escHtml(pro || '-')}</div><div style="${st}"><strong>개선사항</strong> · ${escHtml(con || '-')}</div>`;
  }
  return `<div style="${st}">${escHtml(rec['종합의견'] || '')}</div>`;
}

function buildReportHtml(data) {
  const type = (data.review && data.review.reviewType) || '';
  const rb = getRubric(type, data.track);
  const records = data.records || [];
  const roles = (data.roles && data.roles.length) ? data.roles : DEFAULT_ROLE_ORDER.slice();
  const byRole = role => records.find(r => r['역할'] === role) || null;
  const isProb = rb.adjustable;
  const finalRole = roles.find(r => rb.finalRoles.indexOf(r) >= 0) || null;
  const firstRole = roles[0];
  const rawOf = (rec, area) => {
    if (!rec) return null;
    const f = AREA_FIELD_MAP.find(m => m[0] === area.key)[1];
    const v = Number(rec[f]);
    return area.levels.some(l => l.score === v) ? v : null;
  };
  const ptsOf = (rec, area) => {
    if (!rec) return null;
    const scores = {}; scores[area.key] = rawOf(rec, area);
    return areaPoints(rb, area, scores, rec['확정점수_JSON'] || {});
  };

  // ---- 점수표 ----
  const totals = {}; roles.forEach(r => totals[r] = null);
  let avgSum = 0, avgAny = false;
  const rows = rb.areas.map(area => {
    const cells = roles.map(role => {
      const rec = byRole(role);
      const p = ptsOf(rec, area);
      if (p !== null) totals[role] = (totals[role] || 0) + p;
      if (p === null) return '<td>-</td>';
      if (!isProb) return `<td>${p}점</td>`;
      const raw = rawOf(rec, area);
      const lv = area.levels.find(l => l.score === raw);
      const adj = lv && lv.converted !== p;
      return `<td>${p}점<br><span style="font-size:11px;color:#6b7484;">${raw}점·${escHtml(lv.grade)}${adj ? ' (조정)' : ''}</span></td>`;
    });
    let last;
    if (isProb) {
      const fp = finalRole ? ptsOf(byRole(finalRole), area) : null;
      last = `<td><strong>${fp !== null ? fp + '점' : '-'}</strong></td>`;
    } else {
      const vals = roles.map(r => ptsOf(byRole(r), area)).filter(v => v !== null);
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      if (avg !== null) { avgSum += avg; avgAny = true; }
      last = `<td><strong>${avg !== null ? avg.toFixed(1) + '점' : '-'}</strong></td>`;
    }
    // 멘토·확정평가자 체크가 2단계 이상 차이 → 협의 필요 표시
    let warn = '';
    if (isProb && finalRole && firstRole !== finalRole) {
      const a = rawOf(byRole(firstRole), area), b = rawOf(byRole(finalRole), area);
      if (a !== null && b !== null && Math.abs(a - b) >= 2) warn = ' <span style="color:#c0392b;font-weight:700;">⚠ 2단계 이상 차이</span>';
    }
    return `<tr>
      <td class="text-cell"><strong>${area.no} ${escHtml(area.title)}</strong>${warn}<br><span style="color:#6b7484;">배점 ${area.maxPoints}점</span></td>
      ${cells.join('')}${last}
    </tr>`;
  }).join('');
  const lastTotal = isProb
    ? (finalRole && totals[finalRole] !== null ? totals[finalRole] + '점' : '-')
    : (avgAny ? avgSum.toFixed(1) + '점' : '-');
  const totalRow = `<tr style="background:#f5f6f8;">
    <td class="text-cell"><strong>합계 (100점 만점)</strong></td>
    ${roles.map(r => `<td><strong>${totals[r] !== null ? totals[r] : '-'}</strong></td>`).join('')}
    <td><strong>${lastTotal}</strong></td>
  </tr>`;
  const lastHead = isProb ? `최종 확정${finalRole ? '<br><span style="font-weight:400;font-size:11px;">(' + escHtml(roleLabel(finalRole)) + ' 기준)</span>' : ''}` : '평균(환산)';
  const scoreTable = `
    <table class="report-table">
      <thead><tr><th style="text-align:left;">${isProb ? '평가영역' : '리뷰영역'}</th>${roles.map(r => `<th>${escHtml(roleLabel(r))}</th>`).join('')}<th>${lastHead}</th></tr></thead>
      <tbody>${rows}${totalRow}</tbody>
    </table>
    ${rb.reportFootnote ? `<p style="font-size:11.5px;color:#6b7484;margin-top:6px;">${escHtml(rb.reportFootnote)}</p>` : ''}`;

  // ---- 근거 ----
  const notes = rb.areas.map(area => {
    const nf = AREA_FIELD_MAP.find(m => m[0] === area.key)[2];
    const items = roles.map(role => {
      const rec = byRole(role);
      const note = rec ? rec[nf] : '';
      return note ? `<div style="margin-bottom:4px;"><strong>${escHtml(roleLabel(role))}</strong>: ${escHtml(note)}</div>` : '';
    }).filter(Boolean).join('');
    return items ? `<div style="margin-bottom:8px;"><div style="font-weight:700;font-size:12.5px;">${area.no} ${escHtml(area.title)} 근거</div>${items}</div>` : '';
  }).join('');

  // ---- 위험/저해요인 ----
  const riskRows = [];
  rb.riskItems.forEach((item, idx) => {
    roles.forEach(role => {
      const rec = byRole(role);
      if (!rec) return;
      const e = (rec['위험요인_JSON'] || {})[idx];
      if (e && e.level && e.level !== rb.riskLevels[0]) {
        riskRows.push(`<tr><td>${escHtml(item)}</td><td>${escHtml(roleLabel(role))}</td><td>${escHtml(e.level)}</td><td class="text-cell">${escHtml(e.detail || '')}</td></tr>`);
      }
    });
  });
  const riskHtml = riskRows.length
    ? `<table class="report-table"><thead><tr><th>${escHtml(rb.riskShort)}</th><th>리뷰자</th><th>단계</th><th style="text-align:left;">구체적 사실</th></tr></thead><tbody>${riskRows.join('')}</tbody></table>`
    : `<p style="font-size:13px;color:#1e8a5f;">체크된 ${escHtml(rb.riskShort)}이 없습니다.</p>`;

  // ---- 종합의견 ----
  const opinions = roles.map(role => {
    const rec = byRole(role);
    if (!rec) return `<div class="report-grid" style="margin-bottom:10px;"><div><span class="k">${escHtml(roleLabel(role))}</span> 미제출</div></div>`;
    return `
      <div style="margin-bottom:12px;">
        <div style="font-weight:700;font-size:13px;">${escHtml(isProb ? rb.opinionTitle(role) : roleLabel(role))} · ${escHtml(rec['평가자명'])}</div>
        ${opinionBody(rb, rec)}
        <div class="badge role">${isProb ? '판정' : '추천의견'}: ${escHtml(rec['평가자추천의견'] || '-')}</div>
      </div>`;
  }).join('');
  const finalRec = finalRole ? byRole(finalRole) : null;
  const finalLine = isProb
    ? `<div style="margin:6px 0 12px;font-size:13.5px;"><strong>최종 판정</strong> (${escHtml(finalRole ? roleLabel(finalRole) : '확정평가자')} 기준): <strong style="color:var(--navy, #1f3a6e);">${escHtml(finalRec ? (finalRec['평가자추천의견'] || '-') : '미제출')}</strong></div>`
    : '';

  // ---- 매트릭스 ----
  const hasAction = rb.matrix.some(m => m.action);
  const matrixNote = rb.id === '인턴전환'
    ? `허위보고, 무단결근, 부적절한 언행, 피드백 후 동일 문제 반복 등은 총점과 관계없이 미전환을 검토할 수 있습니다. 최종 판정은 ${roles.length}개 리뷰주체 의견을 종합하여 인사부서 협의로 확정합니다.`
    : rb.matrixNote;

  return `
    <h1>${escHtml((data.review && data.review.reviewTitle) || rb.formTitle)} 리포트</h1>
    <div class="sub">${roles.length}개 리뷰주체(${roles.map(r => escHtml(roleLabel(r))).join('/')}) 종합${isProb ? ' · ' + escHtml(rb.formTitle) : ''}</div>
    <div class="report-grid">
      <div><span class="k">성명</span><strong>${escHtml(data.intern)}</strong></div>
      <div><span class="k">${data.track === '본사' ? '소속' : '배치현장'}</span>${escHtml(data.site || '')}</div>
      <div><span class="k">제출 현황</span>${records.length} / ${roles.length}명</div>
    </div>
    <div class="report-section-title">${escHtml(rb.reportScoreTitle)}</div>
    ${scoreTable}
    <div class="report-section-title">영역별 근거 / 구체적 사례</div>
    <div style="font-size:12.5px;">${notes || '<p style="color:#6b7484;">기재된 근거가 없습니다.</p>'}</div>
    <div class="report-section-title">${escHtml(rb.riskTitle)}</div>
    ${riskHtml}
    <div class="report-section-title">${isProb ? '종합의견 및 ' + escHtml(rb.recoTitle) : '리뷰자별 종합의견 및 추천'}</div>
    ${finalLine}
    ${opinions}
    <div class="report-section-title">${escHtml(rb.matrixTitle)} 매트릭스 (참고)</div>
    <table class="report-table">
      <thead><tr><th>구분</th><th style="text-align:left;">기준</th>${hasAction ? '<th style="text-align:left;">조치</th>' : ''}</tr></thead>
      <tbody>${rb.matrix.map(m => `<tr><td><strong>${escHtml(m.label)}</strong></td><td class="text-cell">${escHtml(m.desc)}</td>${hasAction ? `<td class="text-cell">${escHtml(m.action || '')}</td>` : ''}</tr>`).join('')}</tbody>
    </table>
    <p style="font-size:11.5px;color:#6b7484;">${escHtml(matrixNote)}</p>`;
}

(function () {

  };

  function apiGet(action, params) {
    const url = new URL(CONFIG.API_URL);
    url.searchParams.set('action', action);
    Object.keys(params || {}).forEach(k => url.searchParams.set(k, params[k]));
    return fetch(url.toString()).then(r => r.json());
  }

  function apiPost(payload) {
    return fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight to Apps Script
      body: JSON.stringify(payload)
    }).then(r => r.json());
  }

  function configured() {
    return CONFIG.API_URL && CONFIG.API_URL.indexOf('PASTE_YOUR') === -1;
  }

      topbar.style.display = 'none';

        <a href="admin.html" style="margin-left:10px;color:#cfd8ea;font-size:12px;">관리자 화면 →</a>`;
      document.getElementById('logoutBtn').onclick = logout;
    }
  }

  function logout(msg) {
    if (state.token) apiPost({ action: 'logout', token: state.token }).catch(() => {});
    sessionStorage.removeItem('tr_sabun');
    sessionStorage.removeItem('tr_name');
    sessionStorage.removeItem('tr_token');
    state = { sabun: '', evaluatorName: '', token: '', assignments: [], view: 'login' };

  function applyLogin(res) {
    state.sabun = res.sabun;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function doManualVerify(sabun, code) {
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    if (!sabun || !code) { errEl.textContent = '사번과 인증번호를 모두 입력해주세요.'; return; }
    const btn = document.getElementById('manualVerifyBtn');
    btn.disabled = true;
    btn.textContent = '확인 중...';
    apiPost({ action: 'verifyOtp', sabun: sabun, code: code }).then(res => {
      btn.disabled = false;
      btn.textContent = '확인';
      if (!res.ok) { errEl.textContent = res.error || '인증에 실패했습니다.'; return; }
      applyLogin(res);
    }).catch(() => {
      btn.disabled = false;
      btn.textContent = '확인';
      errEl.textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.';

    const val = document.getElementById('sabunInput').value.trim();

    errEl.textContent = '';

    const btn = document.getElementById('requestOtpBtn');
    btn.disabled = true;
    btn.textContent = '발송 중...';
    apiPost({ action: 'requestOtp', sabun: val }).then(res => {
      btn.disabled = false;
      btn.textContent = '인증번호 받기';

  // ---------- DASHBOARD ----------
  function refreshAssignments() {
    return apiGet('lookup', { token: state.token }).then(res => {

      else if (res.authError) logout(res.error);

  function formatDeadline(d) {
    const dt = (d instanceof Date) ? d : new Date(d);
    const p = n => String(n).padStart(2, '0');
    return `${dt.getFullYear()}.${p(dt.getMonth() + 1)}.${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
  }
  // 서버가 내려준 closed 플래그 + 화면을 열어둔 사이 마감이 지난 경우까지 함께 판단
  function isClosed(x) {
    if (!x) return false;
    if (x.closed) return true;
    return !!(x.deadline && new Date() > new Date(x.deadline));
  }

  // 리뷰자에게 안내하는 마감(표시마감시각). 실제 제출 차단은 x.deadline 기준
  function shownDeadline(x) { return (x && (x.displayDeadline || x.deadline)) || null; }

  function deadlineBannerHtml(x, compact) {
    const closed = isClosed(x);
    const dl = shownDeadline(x) ? formatDeadline(shownDeadline(x)) : '';
    const style = `background:${closed ? '#fdecea' : '#f5f6f8'};border-color:${closed ? '#f3c1ba' : 'var(--line)'};margin:${compact ? '0 0 10px' : '0 0 16px'};padding:10px 14px;font-size:12.5px;`;
    const text = closed
      ? `<strong style="color:var(--bad);">제출 마감${dl ? '(' + dl + ')' : ''}이 지났습니다.</strong> 더 이상 제출·수정이 불가합니다. 문의는 인사담당자에게 해주세요.`
      : (dl ? `제출/수정 마감: <strong>${dl}</strong>까지` : '진행 중');
    return `<div class="card" style="${style}">${text}</div>`;
  }

  // 연도 > 리뷰 > 카드 트리 구성
  function buildTree(assignments) {
    const years = {};
    assignments.forEach((a, idx) => {
      const y = a.year || 0;
      years[y] = years[y] || {};
      const rk = a.reviewId;
      years[y][rk] = years[y][rk] || { reviewId: rk, title: a.reviewTitle, deadline: a.deadline, displayDeadline: a.displayDeadline, closed: a.closed, items: [] };
      years[y][rk].items.push({ a, idx });
    });
    return Object.keys(years).map(Number).sort((x, y) => y - x).map(y => ({
      year: y,
      reviews: Object.values(years[y]).sort((p, q) => String(p.title).localeCompare(String(q.title)))
    }));
  }

  // ---------- FORM ----------
  let formState = null; // { reviewId, reviewTitle, deadline, closed, intern, role, reviewType, track, scores, confirmed, notes, risk, opinion, recommendation }

  // 현재 폼의 문항 세트 (리뷰 유형 + 현장/본사)
  function R() { return getRubric(formState.reviewType, formState.track); }

  function openForm(assignment) {
    state.view = 'form';
    formState = {
      reviewId: assignment.reviewId,
      reviewTitle: assignment.reviewTitle,
      deadline: assignment.deadline,
      displayDeadline: assignment.displayDeadline,
      closed: assignment.closed,
      intern: assignment.intern,
      role: assignment.role,
      reviewType: assignment.reviewType || '',
      track: assignment.track || '현장',
      scores: {}, confirmed: {}, notes: {}, risk: {}, opinion: '', pros: '', cons: '', legacyOpinion: false,
      recommendation: '', recoManual: false, confirmChecked: false
    };
    render();
    // 이전 제출 내용 불러오기 (수정용)
    const fsRef = formState;
    apiGet('myRecord', { token: state.token, intern: assignment.intern, reviewId: assignment.reviewId }).then(res => {
      if (formState !== fsRef) return;
      if (res.authError) { logout(res.error); return; }
      if (res.ok && res.record) {
        const r = res.record;
        AREA_FIELD_MAP.forEach(([key, sk, nk]) => {
          if (r[sk]) formState.scores[key] = Number(r[sk]);
          if (r[nk]) formState.notes[key] = r[nk];
        });
        formState.confirmed = r['확정점수_JSON'] || {};
        formState.risk = r['위험요인_JSON'] || {};
        formState.opinion = r['종합의견'] || '';
        formState.pros = r['장점'] || '';
        formState.cons = r['개선사항'] || '';
        // 장점/개선사항 분리 이전에 제출한 종합의견은 장점 칸에 불러와 나눠 쓰도록 안내
        if (R().splitOpinion && !formState.pros && !formState.cons && formState.opinion) {
          formState.pros = formState.opinion;
          formState.legacyOpinion = true;
        }
        formState.recommendation = r['평가자추천의견'] || '';
        formState.recoManual = true; // 기존 제출값이 있으면 자동계산으로 덮어쓰지 않음
        renderFormBody();
      }
    }).catch(() => {});
  }

  function renderForm() {
    const past = isClosed(formState);
    const rb = R();
    appEl.innerHTML = `

        : (shownDeadline(formState) ? `<div class="card" style="background:#f5f6f8;margin-bottom:16px;padding:10px 14px;font-size:12.5px;">제출/수정 마감: <strong>${formatDeadline(shownDeadline(formState))}</strong>까지</div>` : '')}

  function applyAutoRecommendation() {
    if (formState.recoManual) return; // 사용자가 직접 선택했으면 자동계산으로 덮어쓰지 않음
    const auto = computeAutoRecommendation(formState.scores, formState.risk, R(), formState.confirmed);
    if (auto) formState.recommendation = auto;
  }

  function convertedOf(area) {
    const lv = area.levels.find(l => l.score === formState.scores[area.key]);
    return lv ? lv.converted : null;
  }
  function isAdjusted(area) {
    const conv = convertedOf(area);
    const c = formState.confirmed[area.key];
    return R().adjustable && conv !== null && c !== undefined && c !== '' && Number(c) !== conv;
  }

  function renderFormBody() {
    const body = document.getElementById('formBody');
    if (!body) return;
    const rb = R();

    const guideHtml = rb.guide.length ? `

      </div>` : '';

    const totalHtml = `

          <div class="section-title" style="margin-bottom:2px;">현재 종합점수${rb.adjustable ? ' (확정 점수 합계)' : ''}</div>
          <div style="font-size:12px;color:var(--muted);">${scoredCount}/${maxCount}개 영역 선택됨${scoredCount < maxCount ? ' · 모두 선택하면 최종 점수가 계산됩니다' : ''}</div>
        </div>
        <div style="font-size:28px;font-weight:800;color:var(--navy);">${total}<span style="font-size:14px;font-weight:400;color:var(--muted);"> / 100점</span></div>
      </div>`;

    const areasHtml = rb.areas.map(area => {
      const selected = formState.scores[area.key];
      const conv = convertedOf(area);
      const adjusted = isAdjusted(area);
      const needsNote = selected === 4 || selected === 1 || adjusted;
      const lowGrade = rb.scale[rb.scale.length - 1].grade;
      const confirmedVal = formState.confirmed[area.key] !== undefined && formState.confirmed[area.key] !== '' ? formState.confirmed[area.key] : (conv !== null ? conv : '');
      return `
      <div class="card">
        <div class="section-title">${area.no} ${escapeHtml(area.title)} <span class="pts">배점 ${area.maxPoints}점</span></div>
        ${area.focus ? `<div class="page-desc" style="margin:0 0 4px;"><strong>관찰 포인트</strong>: ${escapeHtml(area.focus)}</div>` : ''}
        <div class="page-desc" style="margin:0 0 8px;">4점(우수)·1점(${escapeHtml(lowGrade)}) 선택${rb.adjustable ? ' 또는 확정 점수 조정' : ''} 시 아래 근거 입력이 <strong style="color:var(--bad);">필수</strong>입니다.</div>
        <div class="level-group" data-area="${area.key}">
          ${area.levels.map(lv => `
            <label class="level-option ${selected === lv.score ? 'selected' : ''}" data-area="${area.key}" data-score="${lv.score}">
              <input type="radio" name="${area.key}" value="${lv.score}" ${selected === lv.score ? 'checked' : ''}/>
              <div>
                <div class="lv-head">${lv.score}점 · ${escapeHtml(lv.grade)}<span class="lv-pts">(환산 ${lv.converted}점)</span></div>
                <div class="lv-text">${escapeHtml(lv.text)}</div>
              </div>
            </label>
          `).join('')}
        </div>
        ${rb.adjustable ? `
        <div style="display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:13px;flex-wrap:wrap;">
          <strong>확정 점수</strong>
          <input type="number" data-confirm="${area.key}" min="0" max="${area.maxPoints}" step="1" value="${escapeHtml(confirmedVal)}" ${conv === null ? 'disabled' : ''} style="width:80px;padding:6px 8px;" />
          <span>/ ${area.maxPoints}점</span>
          <span style="font-size:11.5px;color:${adjusted ? 'var(--warn)' : 'var(--muted)'};">${conv === null ? '단계를 먼저 선택하세요' : (adjusted ? `환산 ${conv}점에서 조정됨 — 근거에 조정 사유 기재` : '환산 점수를 기본값으로 하되 관찰 사실에 따라 조정 가능')}</span>
        </div>` : ''}
        <div class="note-field" data-note-for="${area.key}">
          <label>근거 / 구체적 사례 ${needsNote ? '<span style="color:var(--bad);">(필수)</span>' : '(선택)'}</label>
          ${area.avoid ? `<div style="font-size:11.5px;color:var(--warn);margin:2px 0 6px;">※ '${escapeHtml(area.avoid)}'과 같은 단순 기재는 지양하며, 실사례 중심으로 기재해주세요.</div>` : ''}
          <textarea data-note="${area.key}" placeholder="${escapeHtml(rb.noteGuide || '관찰된 구체적 사실을 작성해주세요.')}${adjusted ? ' (점수 조정 사유 포함)' : ''}">${escapeHtml(formState.notes[area.key] || '')}</textarea>
        </div>
      </div>`;
    }).join('');

    const hasCrit = !!rb.riskCriteria;
    const riskHtml = `
      <div class="card">
        <div class="section-title">${escapeHtml(rb.riskTitle)}</div>
        <div class="page-desc" style="margin-bottom:8px;">${escapeHtml(rb.riskGuide)}</div>
        <table class="risk-table">
          <thead><tr><th style="width:${hasCrit ? 26 : 34}%;">${escapeHtml(rb.riskShort)}</th>${hasCrit ? '<th style="width:30%;">판단 기준</th>' : ''}<th style="width:${hasCrit ? 18 : 26}%;">해당 여부</th><th>구체적 사실</th></tr></thead>
          <tbody>
          ${rb.riskItems.map((item, i) => {
            const cur = formState.risk[i] || { level: rb.riskLevels[0], detail: '' };
            const needsDetail = cur.level !== rb.riskLevels[0];
            const crit = hasCrit ? rb.riskCriteria[i] : null;
            return `
            <tr>
              <td>${escapeHtml(item)}</td>
              ${crit ? `<td style="font-size:11.5px;color:#6b7484;">
                <div><strong style="color:var(--warn);">${escapeHtml(rb.riskMild)}</strong>: ${escapeHtml(crit.caution)}</div>
                <div style="margin-top:4px;"><strong style="color:var(--bad);">${escapeHtml(rb.riskSevere)}</strong>: ${escapeHtml(crit.serious)}</div>
              </td>` : ''}
              <td>
                <div class="risk-radio-group">
                ${rb.riskLevels.map(lv => `
                  <label><input type="radio" name="risk_${i}" value="${lv}" ${cur.level === lv ? 'checked' : ''} data-risk-idx="${i}"/> ${lv}</label>
                `).join('')}
                </div>
              </td>
              <td>
                <input type="text" class="risk-detail" data-risk-detail="${i}" ${needsDetail ? '' : 'style="display:none;"'} value="${escapeHtml(cur.detail || '')}" placeholder="발생시점 · 상황 · 지도내용 · 개선여부" />
              </td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>`;

    const hasAction = rb.matrix.some(m => m.action);
    const opinionHtml = `
      <div class="card">
        <div class="section-title">${escapeHtml(rb.opinionTitle(formState.role))}</div>
        ${rb.splitOpinion ? `
          ${formState.legacyOpinion ? '<div style="font-size:11.5px;color:var(--warn);margin-bottom:8px;">이전에 제출한 종합의견을 장점 칸에 불러왔습니다. 장점과 개선사항으로 나눠 다시 작성해주세요.</div>' : ''}
          <label style="font-weight:700;font-size:13px;display:block;margin:2px 0 4px;">장점 <span style="color:var(--bad);">(필수)</span></label>
          <textarea id="prosInput" placeholder="수습기간 중 확인된 강점을 실사례 중심으로 작성해주세요.">${escapeHtml(formState.pros)}</textarea>
          <label style="font-weight:700;font-size:13px;display:block;margin:12px 0 4px;">개선사항 <span style="color:var(--bad);">(필수)</span></label>
          <textarea id="consInput" placeholder="정식 배치 후 보완이 필요한 점과 육성 방향을 실사례 중심으로 작성해주세요.">${escapeHtml(formState.cons)}</textarea>`
        : `<textarea id="opinionInput" placeholder="관찰된 행동과 업무수행 사실을 바탕으로 종합의견을 작성해주세요.">${escapeHtml(formState.opinion)}</textarea>`}
      </div>
      <div class="card">
        <div class="section-title">${escapeHtml(rb.recoTitle)}</div>
        <div class="page-desc" style="margin-bottom:8px;">${escapeHtml(rb.recoGuide)}</div>
        <div class="reco-group" id="recoGroup">
          ${rb.recoOptions.map(opt => `
            <label class="${formState.recommendation === opt ? 'selected' : ''}" data-reco="${opt}">
              <input type="radio" name="reco" value="${opt}" ${formState.recommendation === opt ? 'checked' : ''}/>${opt}
            </label>
          `).join('')}
        </div>
        ${formState.recommendation
          ? `<div style="font-size:11.5px;color:var(--muted);margin-top:8px;">${formState.recoManual ? '리뷰자가 직접 선택함' : '점수·' + escapeHtml(rb.riskShort) + ' 기준 자동 계산됨 (직접 변경 가능)'}</div>`
          : `<div style="font-size:11.5px;color:var(--muted);margin-top:8px;">5개 영역 점수를 모두 선택하면 자동으로 계산됩니다.</div>`}
        <table class="report-table" style="margin-top:14px;">
          <thead><tr><th>${escapeHtml(rb.matrixTitle)} 구분</th><th style="text-align:left;">기준</th>${hasAction ? '<th style="text-align:left;">조치</th>' : ''}</tr></thead>
          <tbody>
          ${rb.matrix.map(m => `<tr><td><strong>${escapeHtml(m.label)}</strong></td><td class="text-cell">${escapeHtml(m.desc)}</td>${hasAction ? `<td class="text-cell">${escapeHtml(m.action || '')}</td>` : ''}</tr>`).join('')}
          </tbody>
        </table>
        ${rb.matrixNote && rb.id === '수습종료' ? `<div style="font-size:11.5px;color:var(--muted);margin-top:6px;">${escapeHtml(rb.matrixNote)}</div>` : ''}
      </div>`;

    const confirmHtml = rb.confirmText ? `
      <div class="card">
        <div class="section-title">평가자 확인</div>
        <label style="display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.6;cursor:pointer;">
          <input type="checkbox" id="confirmCheck" ${formState.confirmChecked ? 'checked' : ''} style="margin-top:4px;" />
          <span>${escapeHtml(rb.confirmText)}</span>
        </label>
      </div>` : '';

    body.innerHTML = guideHtml + areasHtml + riskHtml + totalHtml + opinionHtml + confirmHtml + `
      <div class="form-actions">
        <button class="btn secondary" id="cancelBtn">취소</button>
        <button class="btn" id="submitBtn" style="width:auto;" ${locked ? 'disabled' : ''}>제출하기</button>
      </div>
      <div class="error-msg" id="formError" style="text-align:right;"></div>
    `;

    // 단계 선택 → 확정 점수는 환산 점수로 초기화
    body.querySelectorAll('.level-option').forEach(el => {
      el.addEventListener('click', () => {
        const area = rb.areas.find(a => a.key === el.dataset.area);
        const score = Number(el.dataset.score);
        formState.scores[area.key] = score;
        if (rb.adjustable) formState.confirmed[area.key] = area.levels.find(l => l.score === score).converted;
        applyAutoRecommendation();
        renderFormBody();
      });
    });
    // 확정 점수 조정
    body.querySelectorAll('[data-confirm]').forEach(el => {
      el.addEventListener('change', () => {
        const area = rb.areas.find(a => a.key === el.dataset.confirm);
        let v = el.value === '' ? convertedOf(area) : Math.round(Number(el.value));
        if (isNaN(v)) v = convertedOf(area);
        v = Math.max(0, Math.min(area.maxPoints, v));
        formState.confirmed[area.key] = v;
        applyAutoRecommendation();
        renderFormBody();
      });
    });
    body.querySelectorAll('[data-note]').forEach(el => {
      el.addEventListener('input', () => { formState.notes[el.dataset.note] = el.value; });
    });
    body.querySelectorAll('[data-risk-idx]').forEach(el => {
      el.addEventListener('change', () => {
        const idx = el.dataset.riskIdx;
        const cur = formState.risk[idx] || {};
        cur.level = el.value;
        formState.risk[idx] = cur;
        applyAutoRecommendation();
        renderFormBody();
      });
    });
    body.querySelectorAll('[data-risk-detail]').forEach(el => {
      el.addEventListener('input', () => {
        const idx = el.dataset.riskDetail;
        const cur = formState.risk[idx] || { level: rb.riskLevels[0] };
        cur.detail = el.value;
        formState.risk[idx] = cur;
      });
    });
    const opinionEl = document.getElementById('opinionInput');
    if (opinionEl) opinionEl.addEventListener('input', () => { formState.opinion = opinionEl.value; });
    const prosEl = document.getElementById('prosInput');
    if (prosEl) prosEl.addEventListener('input', () => { formState.pros = prosEl.value; });
    const consEl = document.getElementById('consInput');
    if (consEl) consEl.addEventListener('input', () => { formState.cons = consEl.value; });
    body.querySelectorAll('#recoGroup label').forEach(el => {
      el.addEventListener('click', () => {
        formState.recommendation = el.dataset.reco;
        formState.recoManual = true;
        renderFormBody();
      });
    });
    const cc = document.getElementById('confirmCheck');
    if (cc) cc.addEventListener('change', () => { formState.confirmChecked = cc.checked; });

    document.getElementById('cancelBtn').onclick = () => {
      state.view = 'dashboard';
      refreshAssignments().then(render);
    };
    document.getElementById('submitBtn').onclick = submitForm;
  }

  function validateForm() {
    const rb = R();
    for (const area of rb.areas) {
      const s = formState.scores[area.key];
      if (!s) return `"${area.title}" 항목을 선택해주세요.`;
      const noNote = !(formState.notes[area.key] || '').trim();
      if ((s === 4 || s === 1) && noNote) {
        return `"${area.title}" — 4점 또는 1점 선택 시 근거를 작성해야 합니다.`;
      }
      if (isAdjusted(area) && noNote) {
        return `"${area.title}" — 확정 점수를 조정한 경우 근거에 조정 사유를 작성해야 합니다.`;
      }
    }
    for (let i = 0; i < rb.riskItems.length; i++) {
      const r = formState.risk[i];
      if (r && r.level && r.level !== rb.riskLevels[0] && !(r.detail || '').trim()) {
        return `${rb.riskShort} "${rb.riskItems[i]}" — '${r.level}' 체크 시 구체적 사실을 작성해야 합니다.`;
      }
    }
    if (rb.splitOpinion) {
      if (!formState.pros.trim()) return '종합의견의 장점을 작성해주세요.';
      if (!formState.cons.trim()) return '종합의견의 개선사항을 작성해주세요.';
    } else if (!formState.opinion.trim()) return '종합의견을 작성해주세요.';
    if (!formState.recommendation) return `${rb.recoTitle}을(를) 선택해주세요.`;
    if (rb.confirmText && !formState.confirmChecked) return '평가자 확인란에 체크해주세요.';
    return null;
  }

  function submitForm() {
    const errEl = document.getElementById('formError');
    if (isClosed(formState)) {
      errEl.textContent = `제출 마감${shownDeadline(formState) ? '(' + formatDeadline(shownDeadline(formState)) + ')' : ''}이 지나 제출할 수 없습니다.`;
      return;
    }
    const err = validateForm();
    if (err) { errEl.textContent = err; return; }
    errEl.textContent = '';
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '제출 중...';
    const rb = R();
    const confirmed = {};
    if (rb.adjustable) rb.areas.forEach(a => {
      const p = areaPoints(rb, a, formState.scores, formState.confirmed);
      if (p !== null) confirmed[a.key] = p;
    });
    apiPost({
      action: 'submit',
      token: state.token,
      reviewId: formState.reviewId,
      role: formState.role,
      intern: formState.intern,
      scores: formState.scores,
      confirmed: rb.adjustable ? confirmed : null,
      notes: formState.notes,
      risk: formState.risk,
      opinion: rb.splitOpinion
        ? `[장점] ${formState.pros.trim()}\n[개선사항] ${formState.cons.trim()}`
        : formState.opinion,
      pros: rb.splitOpinion ? formState.pros.trim() : '',
      cons: rb.splitOpinion ? formState.cons.trim() : '',
      recommendation: formState.recommendation
    }).then(res => {
      if (!res.ok) {
        errEl.textContent = res.authError
          ? res.error + ' (작성 내용은 저장되지 않았습니다. 다시 로그인 후 제출해주세요.)'
          : (res.error || '제출 중 오류가 발생했습니다.');
        btn.disabled = false;
        btn.textContent = '제출하기';
        return;
      }
      state.view = 'dashboard';
      refreshAssignments().then(render);
    }).catch(() => {
      errEl.textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.';
      btn.disabled = false;
      btn.textContent = '제출하기';
    });
  }

  // ---------- ROUTER ----------
  function render() {
    updateTopbar();
    if (state.view === 'login') renderLogin();
    else if (state.view === 'dashboard') renderDashboard();
    else if (state.view === 'form') renderForm();
  }

  // 새로고침 시: 저장된 로그인 토큰이 유효하면 그대로 이어서 사용
  if (state.token && configured()) {
    state.view = 'dashboard';
    apiGet('lookup', { token: state.token }).then(res => {
      if (res.ok) {
        state.evaluatorName = res.evaluatorName;
        state.assignments = res.assignments;
        render();
      } else {
        logout(res.error);
      }
    }).catch(() => render());
  } else if (state.sabun) {
    // 토큰 도입 이전 로그인 정보는 폐기
    sessionStorage.removeItem('tr_sabun');
    sessionStorage.removeItem('tr_name');
    state.sabun = ''; state.evaluatorName = '';
  }

  render();
})();

</script>
</body>
</html>
